<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LoL Build Arena - Argon Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Beaufort+for+LOL:wght@400;700;800&family=Spiegel:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { 
    --bg: #010a13; --pn: #091428; --pn2: #0a182e; --tx: #f0e6d2; --mu: #a09b8c; 
    --gd: #c8aa6e; --gd-light: #f0e6d2; --gd-dark: #785a28; --ln: #3c3c41; 
    --ok: #0ac8b9; --bd: #e84057; --hx: #0397ab; --mg: #b794ff; --cr: #ffd34d;
    box-sizing: border-box; 
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { 
    background: radial-gradient(circle at 50% 0%, #0d2038 0%, #010a13 70%);
    color: var(--tx); font: 13px/1.4 'Spiegel', system-ui, -apple-system, sans-serif; 
    overflow-x: hidden; touch-action: manipulation; min-height: 100vh;
}
#app { max-width: 720px; margin: 0 auto; padding: 12px 12px 135px; }
h1, h2, h3, .hd { font-family: 'Beaufort for LOL', Georgia, serif; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
button, input { font: inherit; color: inherit; border: none; outline: none; background: transparent; }
button { cursor: pointer; }

.top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--gd-dark); padding: 8px 4px 10px; margin-bottom: 12px; background: linear-gradient(90deg, transparent, rgba(3,151,171,0.08), transparent); }
.top-bar .tag { color: var(--hx); font-weight: 700; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
.top-bar .sc { font-family: 'Beaufort for LOL', serif; font-size: 24px; color: var(--gd); text-shadow: 0 0 12px rgba(200,170,110,0.5); }

.duels { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
@media (max-width: 520px) { .duels { grid-template-columns: 1fr; } }
.duel { background: linear-gradient(180deg, rgba(16,31,54,0.95) 0%, rgba(4,10,20,0.98) 100%); border: 1px solid var(--ln); border-radius: 6px; padding: 10px; text-align: center; position: relative; box-shadow: 0 6px 16px rgba(0,0,0,0.6); }
.duel.pl { border-top: 3px solid var(--ok); }
.duel.en { border-top: 3px solid var(--bd); }
.duel-hdr { display: flex; align-items: center; gap: 8px; text-align: left; margin-bottom: 8px; }
.pt { width: 48px; height: 48px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 26px; border: 2px solid var(--gd); background: radial-gradient(circle, #1a324a, #010a13); box-shadow: 0 0 12px rgba(200,170,110,0.25); position: relative; }
.pt .lv-badge { position: absolute; bottom: -4px; right: -4px; background: #010a13; border: 1px solid var(--gd); color: var(--gd); font-size: 9px; font-weight: 800; padding: 1px 4px; border-radius: 10px; }
.duel-title b { display: block; font-size: 15px; color: var(--gd-light); font-family: 'Beaufort for LOL', serif; line-height: 1.1; }
.duel-title small { display: block; color: var(--hx); font-size: 10px; font-weight: 700; text-transform: uppercase; }
.duel-pas { font-size: 10px; color: var(--mu); background: rgba(0,0,0,0.35); padding: 4px 6px; border-radius: 4px; margin-bottom: 6px; text-align: left; border-left: 2px solid var(--gd); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.duel-abs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-bottom: 8px; font-size: 9px; text-align: left; }
.duel-abs span { background: rgba(3,151,171,0.08); border: 1px solid rgba(3,151,171,0.25); border-radius: 3px; padding: 3px 4px; color: var(--tx); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.duel-abs span b { color: var(--gd); }
.arena-hud { display: flex; justify-content: space-between; gap: 6px; margin-bottom: 6px; font-size: 10.5px; background: rgba(9,20,40,0.9); border: 1px solid var(--gd-dark); border-radius: 5px; padding: 5px 10px; color: var(--gd-light); flex-wrap: wrap; }
.arena-hud span { display: inline-flex; align-items: center; gap: 4px; }

.st-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px 6px; font-size: 10px; text-align: left; margin-bottom: 8px; background: rgba(0,0,0,0.4); padding: 6px; border-radius: 4px; border: 1px solid rgba(200,170,110,0.12); }
.st-grid div { display: flex; justify-content: space-between; align-items: center; } 
.st-grid span { color: var(--mu); }
.st-grid b { font-size: 11px; color: var(--tx); }
.st-grid em { color: #22c55e; font-style: normal; font-size: 10px; margin-left: 2px; }

.sl { display: flex; gap: 4px; justify-content: center; }
.sl button { width: 34px; height: 34px; border: 1px solid var(--ln); background: #010a13; border-radius: 4px; display: grid; place-items: center; font-size: 18px; position: relative; transition: 0.15s; }
.sl button.filled { border-color: var(--gd-dark); background: radial-gradient(circle, #13253a, #040a12); cursor: pointer; }
.sl button.filled:hover, .sl button.filled:focus { border-color: var(--gd); transform: translateY(-2px); box-shadow: 0 0 8px rgba(200,170,110,0.4); }

.shop-bar { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
.search-in { flex: 1; background: var(--pn); border: 1px solid var(--ln); border-radius: 4px; padding: 7px 10px; color: var(--tx); font-size: 12px; }
.search-in:focus { border-color: var(--gd); }
.fl { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 8px; scrollbar-width: none; }
.fl::-webkit-scrollbar { display: none; }
.fl button { flex: none; border: 1px solid var(--ln); background: var(--pn); color: var(--mu); border-radius: 4px; padding: 6px 11px; font-family: 'Beaufort for LOL', serif; font-size: 11px; letter-spacing: 0.8px; text-transform: uppercase; transition: 0.2s; }
.fl button.on { background: rgba(200,170,110,0.18); color: var(--gd); border-color: var(--gd); box-shadow: 0 0 8px rgba(200,170,110,0.25); }

.shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(205px, 1fr)); gap: 8px; max-height: 420px; overflow-y: auto; padding-right: 2px; }
.it { text-align: left; background: linear-gradient(145deg, #0b192e, #050d1a); border: 1px solid var(--ln); border-radius: 5px; padding: 9px; transition: 0.15s; cursor: pointer; position: relative; display: flex; flex-direction: column; }
.it:hover { border-color: var(--gd-dark); background: #0e2038; }
.it.sel { border-color: var(--gd); box-shadow: 0 0 12px rgba(200,170,110,0.35); background: rgba(200,170,110,0.1); }
.it.own { opacity: 0.28; pointer-events: none; filter: grayscale(1); }
.it-top { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.it .e { font-size: 24px; width: 34px; height: 34px; display: grid; place-items: center; background: #010a13; border: 1px solid var(--gd-dark); border-radius: 4px; flex: none; } 
.it b { font-size: 13px; color: var(--gd); line-height: 1.15; font-family: 'Beaufort for LOL', serif; }
.it .rec { font-size: 9px; color: var(--ok); text-transform: uppercase; font-weight: 700; display: block; }
.it p { font-size: 11px; color: #c4b998; line-height: 1.3; margin-bottom: 7px; flex-grow: 1; }
.tg { display: flex; flex-wrap: wrap; gap: 3px; margin-top: auto; } 
.tg i { font-style: normal; font-size: 9.5px; background: #010a13; border: 1px solid rgba(3,151,171,0.35); border-radius: 2px; padding: 1px 4px; color: var(--hx); font-weight: 600; }

.buy { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(1,10,19,0.96); border-top: 2px solid var(--gd); padding: 10px 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; backdrop-filter: blur(10px); z-index: 100; box-shadow: 0 -6px 24px rgba(0,0,0,0.75); }
.btn { border: 1px solid var(--gd); border-radius: 4px; padding: 9px 16px; font-family: 'Beaufort for LOL', serif; font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; transition: 0.2s; cursor: pointer; }
.btn-buy { background: linear-gradient(180deg, #e6c883 0%, #9f7928 100%); color: #010a13; border: 1px solid #f0e6d2; box-shadow: 0 0 12px rgba(200,170,110,0.4); }
.btn-buy:hover { filter: brightness(1.12); box-shadow: 0 0 18px rgba(200,170,110,0.7); }
.btn-ghost { background: rgba(200,170,110,0.08); color: var(--gd); }
.btn-ghost:hover, .btn-ghost.on { background: rgba(200,170,110,0.25); color: #fff; border-color: #fff; }
.btn-full { width: 100%; display: block; text-align: center; }

canvas#cv { width: 100%; display: block; border-radius: 6px; border: 1px solid var(--gd); background: #010a13; margin-bottom: 10px; box-shadow: 0 0 28px rgba(3,151,171,0.28); }
canvas#shopCv { width: 100%; display: block; border-radius: 6px; border: 1px solid var(--gd-dark); background: #010a13; margin-bottom: 10px; box-shadow: 0 4px 16px rgba(0,0,0,0.65); }
.ctl-row { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.ctl-row button { flex: 1; padding: 7px 6px; font-size: 12px; min-width: 72px; }

.log { background: #030912; border: 1px solid var(--ln); border-radius: 6px; height: 155px; overflow-y: auto; padding: 8px 10px; font-size: 11.5px; font-family: ui-monospace, monospace; line-height: 1.45; }
.log div { padding: 3px 0; border-bottom: 1px dashed rgba(255,255,255,0.05); } 
.log .p { color: var(--ok); } .log .e { color: var(--bd); } 
.log .crit { color: #ffd34d; font-weight: bold; } 
.log .venom { color: #4ade80; } .log .burn { color: #fb923c; }
.log .stun { color: #facc15; font-weight: 700; background: rgba(250,204,21,0.08); padding-left: 4px; border-left: 2px solid #facc15; }
.log .heal { color: #34d399; }

.card { background: linear-gradient(180deg, #0b192e 0%, #050c18 100%); border: 1px solid var(--ln); border-radius: 6px; padding: 14px; margin-bottom: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
.champ-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; max-height: 360px; overflow-y: auto; margin-top: 8px; padding: 4px; background: rgba(0,0,0,0.35); border-radius: 4px; }
.ch-pick { background: var(--pn); border: 1px solid var(--ln); border-radius: 4px; padding: 6px 4px; text-align: center; cursor: pointer; transition: 0.15s; font-size: 11px; }
.ch-pick:hover { border-color: var(--gd); transform: translateY(-2px); }
.ch-pick.sel { border-color: var(--ok); background: rgba(10,200,185,0.18); box-shadow: 0 0 10px rgba(10,200,185,0.35); }
.ch-pick.sel-en { border-color: var(--bd); background: rgba(232,64,87,0.18); box-shadow: 0 0 10px rgba(232,64,87,0.35); }
.ch-pick span { display: block; font-size: 22px; margin-bottom: 2px; }

.tooltip-box { display: none; position: fixed; bottom: 82px; left: 50%; transform: translateX(-50%); width: min(92vw, 440px); background: rgba(1,10,19,0.98); border: 1px solid var(--gd); padding: 12px 14px; border-radius: 6px; z-index: 300; box-shadow: 0 10px 30px rgba(0,0,0,0.9); }
.tooltip-box.active { display: block; }
.tooltip-box b { color: var(--gd); font-family: 'Beaufort for LOL', serif; font-size: 15px; display: block; margin-bottom: 3px; }
.tooltip-box p { color: #d0c8b8; font-size: 12px; margin-bottom: 6px; }

.it .e img, .sl button img { width:100%; height:100%; object-fit:cover; display:block; border-radius:3px; }
.sl button { overflow:hidden; padding:1px; }
.buy img { width:34px; height:34px; object-fit:cover; vertical-align:middle; border:1px solid var(--gd-dark); border-radius:4px; margin-right:7px; }
.it .e { overflow:hidden; padding:1px; }

/* COMPLETE CATALOG V14 */
#cv{height:500px!important;background:#020617;border-radius:10px;box-shadow:0 25px 85px #000}
.wrap{max-width:1120px}

/* UX & ARENA V15 */
.it[data-a="sel"]{cursor:pointer;position:relative;transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease}
.it[data-a="sel"]:hover{transform:translateY(-2px);border-color:#c8aa6e;box-shadow:0 10px 28px rgba(0,0,0,.4),0 0 0 1px rgba(200,170,110,.25)}
.it[data-a="sel"]:active{transform:scale(.975)}
.it[data-a="sel"]:focus-visible{outline:2px solid #5eead4;outline-offset:2px}
.it[data-a="sel"]::after{content:'2 CLICS: EQUIPAR';position:absolute;right:7px;bottom:5px;font-size:8px;font-weight:900;letter-spacing:.07em;color:#c8aa6e;opacity:0;transition:opacity .14s}
.it[data-a="sel"]:hover::after{opacity:.9}
.game-toast{position:fixed;left:50%;top:18px;z-index:9999;transform:translate(-50%,-18px) scale(.96);padding:11px 18px;border:1px solid #c8aa6e;border-radius:8px;background:rgba(1,10,19,.96);color:#f0e6d2;font-weight:900;box-shadow:0 14px 50px #000;opacity:0;pointer-events:none;transition:.2s ease}
.game-toast.show{opacity:1;transform:translate(-50%,0) scale(1)}.game-toast.ok{border-color:#0ac8b9}.game-toast.warn{border-color:#f59e0b}

@media(max-width:680px){.build-progress{grid-template-columns:repeat(3,1fr)}.sl{grid-template-columns:repeat(6,34px)!important;overflow-x:auto}}

function buildTacticalW(n, a, t) {
    if (SUMMON_CHAMPS[n]) {
        return { n: SUMMON_CHAMPS[n].n, k: 'summon', m: 0.95, cd0: 8.5, cd: 2.0, s: 0, f: 'sum' };
    }
    if (PARRY_CHAMPS[n]) {
        return { n: PARRY_CHAMPS[n], k: 'parry', m: 0.85, cd0: 9.0, cd: 2.5, s: n === 'Fiora' ? 0.9 : 0, f: 'parry' };
    }
    if (WHIRLWIND_CHAMPS.has(n)) {
        return { n: n === 'Garen' ? 'Juicio (Torbellino)' : n === 'Darius' ? 'Diezmar (Filo)' : 'Torbellino Cortante', k: 'whirlwind', m: 1.15, cd0: 6.5, cd: 1.8, s: 0, f: 'aoe' };

    if (a === 'R') return { n: 'Paso Ligero / Ráfaga', k: 'volley', m: 1.05, cd0: 6.5, cd: 2.0, s: 0, f: 'dash_k' };
    if (a === 'A') return { n: 'Paso Sombrío (Emboscada)', k: 'slash', m: 1.15, cd0: 6.8, cd: 1.8, s: 0, f: 'g' };

}

        }
        return { n: nn, k: finalVfx, m: +m, cd0: +cd, cd: +cd, s: +st, f: f || '' };
    });
    const wAb = buildTacticalW(n, a, t);
    const k = [baseK[0], wAb, baseK[1]];

const champLv = (itemsCount) => Math.min(18, 3 + itemsCount * 3); // 0 items=Lv3, 5+ items=Lv18

function isRecommended(c, item) {
    if (item.c === 'B') return true;
    if (c.a === 'T' && item.c === 'T') return true;
    if (c.a === 'L' && (item.c === 'L' || item.c === 'T')) return true;
    if (c.a === 'A' && (item.c === 'X' || (c.t === 'm' && item.c === 'M'))) return true;
    if (c.a === 'M' && item.c === 'M') return true;
    if (c.a === 'R' && item.c === 'C') return true;
    if (c.a === 'E' && (item.c === 'S' || item.c === 'M')) return true;
    return false;
}

function calc(c, items, lv) {
    const a = AR[c.a], L = lv - 1;
    let s = { 
        hp: a[1] + a[6] * L, ad: a[2] + a[7] * L, ap: c.t === 'm' ? (25 + 4 * L) : 0, 
        ar: a[4] + a[8] * L, mr: a[5] + a[9] * L, crit: 0, haste: 0, ls: 0, 
        pen: 0, mpen: 0, ms: 335, rg: 2, bad: a[2] + a[7] * L, lv
    };
    let bonus_as = 0, ap_mult = 0, ar_mult = 0, mr_mult = 0;
    s.p = {};

    if (c.pas) {
        const pt = c.pas.t, pv = c.pas.v;
        if (pt === 'ls') s.ls += pv;
        else if (pt === 'cr') s.crit += pv;
        else if (pt === 'as') bonus_as += pv;
        else if (pt === 'ar') { s.ar += pv; s.mr += pv; }
        else if (pt === 'rg') s.rg += pv;
    }

    for (const i of items) {
        for (const k in i.s) {
            if (k === 'as') bonus_as += i.s[k];
            else if (s[k] !== undefined) s[k] += i.s[k];
        }
        if (i.p) {
            for (const k in i.p) {
                if (k === 'ap_mult') ap_mult += i.p[k];
                else if (k === 'ar_mult') ar_mult += i.p[k];
                else if (k === 'mr_mult') mr_mult += i.p[k];
                else s.p[k] = Math.max(s.p[k] || 0, i.p[k]);
            }
        }
    }

    s.ap = s.ap * (1 + ap_mult / 100);
    s.ar = s.ar * (1 + ar_mult / 100);
    s.mr = s.mr * (1 + mr_mult / 100);
    s.as = Math.min(2.5, a[3] * (1 + bonus_as / 100));
    s.crit = Math.min(100, s.crit);
    s.pen = Math.min(65, s.pen);
    s.mpen = Math.min(65, s.mpen);
    s.dodge = Math.min(32, Math.max(0, (s.ms - 335) * 0.14 + (s.p.dodge_b || 0)));
    s.shield = (s.p.shield_start || 0) * (1 + (s.p.heal_amp || 0) / 100);
    return s;
}

function aiBuy(){
    const e=G.ch[1],p=G.ch[0],R=roundNum(),mine=G.it[1];
    if(mine.length>=MAX_ITEMS)return;
    if(mine.length===BOOT_SLOT){
        const boots = IT.filter(i => i.c === 'B');
        if (e.t === 'm') mine.push(boots[1]); // Sorc shoes
        else if (e.a === 'R') mine.push(boots[0]); // Berserker
        else if (p.t === 'm') mine.push(boots[3]); // Mercs
        else mine.push(boots[2]); // Plated Steelcaps
        return;
    }

    const avail = IT.filter(i => !mine.includes(i) && i.c !== 'B');
    const pStats = calc(p, G.it[0], champLv(G.it[0].length));

    const scored = avail.map(i => {
        let sc = Math.random() * 14;
        if (isRecommended(e, i)) sc += 45;
        if (e.t === 'm' && i.s.ap) sc += 35;
        if (e.t === 'p' && i.s.ad) sc += 35;
        if (e.a === 'R' && (i.s.crit || i.s.as)) sc += 30;
        if (e.a === 'T' && (i.s.hp || i.s.ar || i.s.mr)) sc += 35;
        if (G.diff >= 1) {
            if (p.t === 'm' && i.s.mr) sc += 25 * G.diff;
            if (p.t === 'p' && i.s.ar) sc += 25 * G.diff;
            if (pStats.ls >= 12 && i.p.gw) sc += 35 * G.diff;
            if (pStats.ar >= 150 && (i.s.pen || i.s.mpen)) sc += 30 * G.diff;
        }
        return { i, sc };
    }).sort((a, b) => b.sc - a.sc);

    mine.push(scored[0].i);
}

const EXECUTE_CHAMPS = new Set(["Darius", "Garen", "Pyke", "Veigar", "Cho'Gath", "Evelynn", "Caitlyn", "Jhin", "Jinx", "Akali", "Zed", "Viego", "Karthus", "Urgot", "Rek'Sai", "Kayn", "Briar", "Smolder", "Kog'Maw", "Miss Fortune", "Samira", "Katarina", "Master Yi"]);
const DARK_REALM_ULTS = new Set(["Mordekaiser", "Nocturne", "Fiddlesticks", "Karthus", "Viego", "Aatrox", "Swain", "Malzahar", "Evelynn", "Shaco"]);

function sim(S, C) {
    const P = [0, 1].map(i => ({
        s: { ...S[i], p: { ...S[i].p } }, c: C[i], hp: S[i].hp, sh: S[i].shield,
        x: i ? 7.3 : 1.7, y: 1.5, z: 0,
        at: 0.24 + i * 0.04, gcd: 0.45 + i * 0.08,
        stun: 0, maxStun: 0, burn: 0, psn: 0, slw: 0, zhonya: 0,
        stealth: 0, parry: 0, inBrush: 0,
        aaCount: 0, sheen: 0, stacks: 0, sunderCD: 0, burstCD: 0, hsCD: 1.5, evadeCD: 0.8, bushCD: 1.5,
        usedLifeline: false, usedZhonya: false, usedGA: false, usedQSS: false,
        spellShield: S[i].p.spell_shield ? 1 : 0,
        dmg: 0, mit: 0, heal: 0, dod: 0, ccTime: 0,
        aiState: C[i].a === 'R' ? '🎯 POSICIONANDO' : '⚔️ AVANZANDO',
        ab: C[i].k.map((a, idx) => ({ ...a, cd: idx === 0 ? a.cd0 * 0.14 : idx === 1 ? a.cd0 * 0.25 : a.cd0 * 0.40 }))
    }));

    const brushes = [{ x: 4.5, y: 0.45, r: 0.95 }, { x: 4.5, y: 2.55, r: 0.95 }];
    const fruits = [
        { id: 0, x: 2.75, y: 0.55, active: false, spawnT: 4.5 },
        { id: 1, x: 6.25, y: 2.45, active: false, spawnT: 7.0 }
    ];
    let summons = [];
    let realmFx = { active: 0, col: '#14b8a6', owner: -1 };

    const F = [[
        0, P[0].hp, P[1].hp, P[0].x, P[1].x,
        0, 0, 0, 0, 0, 0, 0, 0,
        P[0].sh, P[1].sh, P[0].y, P[1].y,
        0, 0, 0, 0, P[0].spellShield, P[1].spellShield,
        P[0].ab[0].cd, P[0].ab[2].cd, P[1].ab[0].cd, P[1].ab[2].cd,
        1, 1, P[0].aiState, P[1].aiState,
        P[0].ab[1].cd, P[1].ab[1].cd,
        0, 0, 0, 4.5,
        [], -1
    ]], lg = [], EV = [];
    let t = 0;
    const DT = 0.15;

    function healUnit(i, rawHeal) {
        const m = P[i], o = P[1 - i];
        if (rawHeal <= 0 || m.hp <= 0) return;
        const gwMult = 1 - (o.s.p.gw || 0) / 100;
        const ampMult = 1 + (m.s.p.heal_amp || 0) / 100;
        const actual = Math.min(m.s.hp - m.hp, rawHeal * gwMult * ampMult);
        if (actual > 0) { m.hp += actual; m.heal += actual; }
    }

    function applyStun(attackerIdx, targetIdx, baseDur, vfxKind, abilityName, isWallSlam = false) {
        const m = P[attackerIdx], o = P[targetIdx];
        if (baseDur <= 0 || o.zhonya > 0) return;
        if (o.parry > 0) {
            o.parry = 0;
            o.aiState = '🤺 ¡PARRY PERFECTO!';
            EV.push([t, targetIdx, 'sh', 0, 'shield', '🤺 ¡BLOQUEO PARRY!']);
            if (o.c.n === 'Fiora' || o.c.n === 'Jax') {
                const counterDur = 0.85;
                m.stun = Math.max(m.stun, counterDur);
                m.maxStun = Math.max(m.maxStun, counterDur);
                EV.push([t, attackerIdx, 'stun', counterDur, 'slash', '⚡ ¡CONTRAATAQUE!']);
                lg.push([t, targetIdx, `🤺 ¡${o.c.n} devuelve el aturdimiento a ${m.c.n} con ${o.ab[1].n}!`, 'stun']);
            }
            return;
        }
        if (!o.usedQSS && o.s.p.qss) {
            o.usedQSS = true;
            healUnit(targetIdx, 150);
            o.aiState = '🧼 ¡QSS PURIFICADO!';
            EV.push([t, targetIdx, 'sh', 0, 'shield', '🧼 ¡PURIFICADO!']);
            lg.push([t, targetIdx, `🧼 ¡${o.c.n} limpia el control de masas de ${abilityName} con Mercurio!`, 'heal']);
            return;
        }
        const stunDur = Math.max(0.25, baseDur * (1 - (o.s.p.ten || 0) / 100));
        o.stun = Math.max(o.stun, stunDur);
        o.maxStun = Math.max(o.maxStun, stunDur);
        o.aiState = isWallSlam ? '🧱 ¡ESTRELLADO EN MURO!' : '⚡ INMOVILIZADO';
        EV.push([t, targetIdx, 'stun', stunDur, vfxKind, isWallSlam ? `🧱 ¡MURO + STUN ${stunDur.toFixed(1)}s!` : `⚡ ¡ATURDIDO ${stunDur.toFixed(1)}s!`]);
        lg.push([t, attackerIdx, `${isWallSlam ? '🧱 ¡IMPACTO CONTRA EL MURO! ' : '⚡ ¡'}${abilityName} de ${m.c.n} inmoviliza a ${o.c.n} (${stunDur.toFixed(1)}s)!`, 'stun']);
    }

    function deal(i, raw, type, isCrit = false, isAA = false) {
        const m = P[i], o = P[1 - i], S1 = m.s, T = o.s;
        if (o.zhonya > 0) return 0;
        if (o.parry > 0) {
            raw *= 0.25;
            if (isAA) {
                o.aiState = '🛡️ ¡BLOQUEADO!';
                return -2;
            }
        }

        // Bono de emboscada desde la Maleza
        if (m.stealth > 0 || m.inBrush > 0) {
            raw *= 1.18;
            m.stealth = 0;
        }

        if (!isAA && S1.p.spell_amp) raw *= (1 + S1.p.spell_amp / 100);
        if (o.hp < T.hp * 0.42) {
            if (m.c.pas.t === 'ex') raw *= (1 + m.c.pas.v / 100);
            if (S1.p.shadowflame && type === 'm') { raw *= 1.20; isCrit = true; }
        }
        if (m.c.pas.t === 'st') raw *= (1 + m.stacks * (m.c.pas.v / 100));

        if (isAA && T.p.dr_aa) raw *= (1 - T.p.dr_aa / 100);
        if (T.p.dr_all) raw *= (1 - T.p.dr_all / 100);
        if (isCrit && T.p.dr_crit) raw *= (1 - T.p.dr_crit / 100);

        const bushDodgeBonus = (o.inBrush > 0 && m.inBrush <= 0) ? 14 : 0;
        if (o.stun <= 0 && Math.random() * 100 < (T.dodge + bushDodgeBonus) * (type === 'm' ? 0.55 : 0.88)) {
            o.dod++;
            o.y = Math.max(0.42, Math.min(2.58, o.y + (o.y < 1.5 ? 0.58 : -0.58)));
            o.aiState = '💨 ¡SIDESTEP!';
            return -1;
        }

        let d = raw;
        if (type === 'p') {
            const effAr = Math.max(0, T.ar * (1 - S1.pen / 100));
            d = raw * 100 / (100 + effAr);
        } else if (type === 'm') {
            const effMr = Math.max(0, T.mr * (1 - S1.mpen / 100));
            d = raw * 100 / (100 + effMr);
        }
        m.mit += Math.max(0, raw - d);

        if (o.sh > 0 && S1.p.shield_break) o.sh *= 0.5;
        if (o.sh > 0) {
            const abs = Math.min(o.sh, d);
            o.sh -= abs;
            d -= abs;
        }

        o.hp -= d;
        m.dmg += d;

        if (S1.ls > 0 && d > 0) healUnit(i, d * (S1.ls / 100));

        if (!o.usedLifeline && T.p.lifeline && o.hp > 0 && o.hp < T.hp * 0.38) {
            o.usedLifeline = true;
            const shGain = T.p.lifeline * (1 + (T.p.heal_amp || 0) / 100);
            o.sh += shGain;
            o.aiState = '🛡️ ¡SALVAVIDAS!';
            EV.push([t, 1 - i, 'sh', shGain, 'shield', '🛡️ ¡SALVAVIDAS!']);
            lg.push([t, 1 - i, `🛡️ ¡Salvavidas activa un escudo de ${Math.round(shGain)} en ${o.c.n}!`, 'heal']);
        }

        if (!o.usedZhonya && T.p.zhonya && o.hp > 0 && o.hp < T.hp * 0.28) {
            o.usedZhonya = true;
            o.zhonya = 1.5;
            o.aiState = '⌛ ¡ESTASIS ZHONYA!';
            EV.push([t, 1 - i, 'zh', 0, 'zhonya', '⌛ ¡ZHONYA!']);
            lg.push([t, 1 - i, `⌛ ¡${o.c.n} activa Reloj de Arena de Zhonya (Invulnerable)!`, 'stun']);
        }

        if (S1.p.execute && o.hp > 0 && (o.hp / T.hp) * 100 <= S1.p.execute) {
            o.hp = 0;
            EV.push([t, i, 'c', 999, 'sky_blade', '🪙 ¡EJECUTADO!']);
            lg.push([t, i, `🪙 ¡Ejecución instantánea de ${m.c.n} sobre ${o.c.n}!`, 'crit']);
        }

        return d;
    }

    while (t < 65 && P[0].hp > 0 && P[1].hp > 0) {
        t = +(t + DT).toFixed(2);

        // Aparición de Frutamiel en el mapa
        for (const fr of fruits) {
            if (!fr.active && t >= fr.spawnT) {

        for (let sIdx = summons.length - 1; sIdx >= 0; sIdx--) {

            if (sm.life <= 0) { summons.splice(sIdx, 1); continue; }
            const target = P[1 - sm.owner];
            const owner = P[sm.owner];
            if (target.hp > 0 && target.zhonya <= 0 && sm.atkCD <= 0) {
                sm.atkCD = 1.05;
                const smRaw = 42 + owner.s.ap * 0.28 + (owner.s.ad - owner.s.bad) * 0.35;
                const smDmg = deal(sm.owner, smRaw, owner.c.t === 'm' ? 'm' : 'p', false, false);

                }

        }

        for (const i of [0, 1]) {
            const m = P[i], o = P[1 - i], S1 = m.s, c = C[i], mg = c.t === 'm';

            if (m.sunderCD > 0) m.sunderCD -= DT;
            if (m.burstCD > 0) m.burstCD -= DT;
            if (m.hsCD > 0) m.hsCD -= DT;
            if (m.evadeCD > 0) m.evadeCD -= DT;
            if (m.bushCD > 0) m.bushCD -= DT;
            if (m.stealth > 0) m.stealth = Math.max(0, m.stealth - DT);
            if (m.parry > 0) m.parry = Math.max(0, m.parry - DT);

            // Comprobar si está dentro de la Maleza
            const inB = brushes.some(b => Math.hypot(m.x - b.x, m.y - b.y) <= b.r);

            for (const fr of fruits) {

                    m.aiState = '🍈 ¡FRUTAMIEL +VIDA!';
                    EV.push([t, i, 'fruit', fruitHeal, 'heal', `🍈 ¡FRUTAMIEL +${Math.round(fruitHeal)}!`]);

                m.aiState = '🔥 ¡QUEMADURA DE ANILLO!';

                const pDmg = (14 + (o.c.pas.t === 'vn' ? o.c.pas.v : 0)) * DT;
                m.hp -= pDmg; o.dmg += pDmg;

                m.burn -= DT;

            if (S1.p.burn_aura && dist <= 2.6 && o.zhonya <= 0) {

                o.hp -= auraDmg; m.dmg += auraDmg;
                healUnit(i, auraDmg * 0.35);

            if (m.slw > 0) m.slw -= DT;
            if (m.stun > 0) {
                m.stun = Math.max(0, m.stun - DT);
                m.ccTime += DT;
                m.aiState = `⚡ ATURDIDO (${m.stun.toFixed(1)}s)`;
                m.z = m.stun > 0 ? Math.max(0, Math.sin((m.stun / (m.maxStun || 1)) * Math.PI) * 24) : 0;
                continue;
            }
            m.z = 0;

            const rng = AR[c.a][10];
            const imRanged = rng >= 4.0;
            const enemyMelee = AR[o.c.a][10] < 3.0;
            let effMs = S1.ms * (m.inBrush ? 1.10 : 1.0);
            if (m.slw > 0) effMs *= (1 - 0.35 * (1 - (S1.p.slow_res || 0) / 100));
            const step = (effMs / 100) * (DT * 1.18);

            m.at -= DT; m.gcd -= DT;
            m.ab.forEach(a => a.cd = Math.max(0, a.cd - DT));

            const performTacticalMove = (mult = 1.0) => {
                const curDist = Math.hypot(o.x - m.x, o.y - m.y);
                const dx = o.x - m.x, dy = o.y - m.y, dNorm = curDist || 1;
                const minSafeX = t > 16 ? Math.max(0.75, 4.5 - fireRadius + 0.25) : 0.75;
                const maxSafeX = t > 16 ? Math.min(8.25, 4.5 + fireRadius - 0.25) : 8.25;

                // Prioridad 0: Volver dentro del Anillo de Fuego si se está cerrando
                if (m.x < minSafeX || m.x > maxSafeX) {
                    const toCenter = Math.sign(4.5 - m.x) || 1;
                    m.x = Math.max(0.65, Math.min(8.35, m.x + toCenter * step * 1.35));
                    m.aiState = '🔥 ENTRANDO A ZONA SEGURA';

                // Prioridad 1: Disputar Frutamiel si tiene menos del 72% de vida (o negar al rival herido)
                const activeFruit = fruits.find(fr => fr.active && Math.hypot(fr.x - m.x, fr.y - m.y) < 3.6);
                if (activeFruit && (m.hp < S1.hp * 0.72 || (o.hp < o.s.hp * 0.55 && Math.hypot(activeFruit.x - m.x, activeFruit.y - m.y) < Math.hypot(activeFruit.x - o.x, activeFruit.y - o.y)))) {
                    const fdx = activeFruit.x - m.x, fdy = activeFruit.y - m.y, fd = Math.hypot(fdx, fdy) || 1;
                    m.x = Math.max(minSafeX, Math.min(maxSafeX, m.x + (fdx / fd) * step * 1.2));
                    m.y = Math.max(0.42, Math.min(2.58, m.y + (fdy / fd) * step * 1.2));
                    m.aiState = '🍈 YENDO A FRUTAMIEL';
                    return;

                // Prioridad 2: Asesinos o Campeones de Emboscada buscan la Maleza cuando sus habilidades recargan
                const allOnCD = m.ab[0].cd > 1.2 && m.ab[2].cd > 1.5;
                if ((c.a === 'A' || c.n === 'Rengar' || c.n === 'Teemo' || c.n === 'Evelynn' || c.n === 'Kha\'Zix' || c.n === 'Pyke') && (allOnCD || c.n === 'Rengar') && !m.inBrush && m.bushCD <= 0) {
                    const nearBrush = brushes.reduce((best, b) => Math.hypot(b.x - m.x, b.y - m.y) < Math.hypot(best.x - m.x, best.y - m.y) ? b : best, brushes[0]);
                    if (Math.hypot(nearBrush.x - m.x, nearBrush.y - m.y) < 3.2) {
                        const bdx = nearBrush.x - m.x, bdy = nearBrush.y - m.y, bd = Math.hypot(bdx, bdy) || 1;
                        m.x = Math.max(minSafeX, Math.min(maxSafeX, m.x + (bdx / bd) * step * 1.25));
                        m.y = Math.max(0.42, Math.min(2.58, m.y + (bdy / bd) * step * 1.25));
                        m.aiState = '🌿 BUSCANDO MALEZA';
                        if (Math.hypot(nearBrush.x - m.x, nearBrush.y - m.y) <= nearBrush.r) {
                            m.stealth = 1.6;
                            m.bushCD = 5.0;
                            m.aiState = '🌿 ¡CAMUFLAJE ACTIVO!';
                        }
                        return;
                    }
                }

                // Prioridad 3: Campeones de Estampida de Muro (Vayne, Poppy, Qiyana, Lee Sin...) buscan alinear al rival contra el muro
                if (WALL_SLAM_CHAMPS.has(c.n) && (o.x < 2.2 || o.x > 6.8) && m.ab[0].cd <= 1.2) {
                    m.y += Math.sign(o.y - m.y) * step * 0.9;

                // 1. TIRADOR (R): Orb-walking + Respeto de Gapcloser + Giro Evasivo en Esquina
                if (c.a === 'R') {
                    const enemyHasDashReady = enemyMelee && o.ab[0].cd <= 0.6;
                    const idealDist = enemyHasDashReady ? rng * 0.96 : (enemyMelee ? rng * 0.88 : rng * 0.80);
                    if (curDist < idealDist) {
                        let nx = m.x - (dx / dNorm) * step * mult;
                        if ((nx <= minSafeX + 0.55 || nx >= maxSafeX - 0.55) && m.evadeCD <= 0) {
                            m.evadeCD = 2.2;
                            const escapeDir = m.x < 4.5 ? 1 : -1;
                            const dashX = Math.max(minSafeX, Math.min(maxSafeX, m.x + escapeDir * step * 2.7));
                            EV.push([t, i, 'dash', m.x, dashX]);
                            m.x = dashX;
                            m.y = m.y < 1.5 ? 2.38 : 0.62;
                            m.aiState = '💨 GIRO EVASIVO';
                        } else {
                            m.x = Math.max(minSafeX, Math.min(maxSafeX, nx));
                            m.y = Math.max(0.45, Math.min(2.55, m.y + Math.cos(t * 4.5 + i) * 0.22));
                            m.aiState = o.stun > 0 ? '🎯 CASTIGANDO STUN' : (enemyHasDashReady ? '⚠️ RESPETANDO RANGO' : '🎯 ORB-WALKING');
                        }
                    } else if (curDist > rng - 0.1) {
                        m.x = Math.max(minSafeX, Math.min(maxSafeX, m.x + (dx / dNorm) * step * mult));
                        m.y = Math.max(0.45, Math.min(2.55, m.y + (dy / dNorm) * step * 0.55 * mult));
                        m.aiState = '🎯 PRESIONANDO RANGO';
                    } else {
                        m.y = Math.max(0.45, Math.min(2.55, m.y + Math.sin(t * 5.2 + i) * 0.18));
                        m.aiState = '🎯 MICRO-SPACING';
                    }
                    return;
                }

                // 2. MAGO (M) Y ENCANTADOR (E): Cooldown Tethering (Entra con CD listo, kitea en CD)
                if (c.a === 'M' || c.a === 'E') {
                    const abReady = m.ab.some(a => a.cd <= 0.35);
                    const tetherDist = abReady ? rng * 0.85 : rng + 0.95;
                    if (curDist < tetherDist - 0.25) {
                        let nx = m.x - (dx / dNorm) * step * mult;
                        if (nx <= minSafeX + 0.45 || nx >= maxSafeX - 0.45) {
                            const escapeDir = m.x < 4.5 ? 1 : -1;
                            nx = m.x + escapeDir * step * 1.75;
                            m.y = m.y < 1.5 ? 2.35 : 0.65;
                        }
                        m.x = Math.max(minSafeX, Math.min(maxSafeX, nx));
                        m.aiState = abReady ? '🔮 ALINEANDO COMBO' : '⏳ ESPACIANDO CD';
                    } else if (curDist > rng - 0.1) {
                        m.x = Math.max(minSafeX, Math.min(maxSafeX, m.x + (dx / dNorm) * step * mult));
                        m.aiState = '🔮 BUSCANDO RANGO';
                    } else {
                        m.y = Math.max(0.45, Math.min(2.55, m.y + Math.cos(t * 4.2 + i) * 0.18));
                        m.aiState = '🔮 CANALIZANDO';
                    }
                    return;
                }

                // 3. ASESINO (A): Emboscada y Repliegue Sombrío
                if (c.a === 'A') {
                    if (allOnCD && 'TL'.includes(o.c.a) && o.stun <= 0 && curDist < 2.3) {
                        m.x = Math.max(minSafeX, Math.min(maxSafeX, m.x - (dx / dNorm) * step * 1.18));
                        m.y = Math.max(0.45, Math.min(2.55, m.y + (m.y < 1.5 ? 0.38 : -0.38)));
                        m.aiState = '🌑 REPLIEGUE SOMBRÍO';
                    } else if (curDist > rng - 0.1) {
                        m.x = Math.max(minSafeX, Math.min(maxSafeX, m.x + (dx / dNorm) * step * 1.15 * mult));
                        m.y = Math.max(0.45, Math.min(2.55, m.y + Math.sin(t * 7 + i) * 0.24));
                        m.aiState = m.inBrush ? '🌿 ¡ACECHO EN MALEZA!' : '🗡️ FLANQUEANDO';
                    } else {
                        m.aiState = '🗡️ COMBO LETAL';
                    }
                    return;
                }

                // 4. LUCHADOR (L) Y TANQUE (T): Presión e Intercepción
                if (curDist > rng - 0.15) {
                    m.x = Math.max(minSafeX, Math.min(maxSafeX, m.x + (dx / dNorm) * step * mult));
                    m.y = Math.max(0.45, Math.min(2.55, m.y + (dy / dNorm) * step * 0.88 * mult));
                    m.aiState = c.a === 'T' ? '🛡️ AVANCE IMPLACABLE' : '⚔️ ACORTANDO DISTANCIA';
                } else {
                    m.y = Math.max(0.45, Math.min(2.55, m.y + Math.sin(t * 4.5 + i) * 0.14));
                    m.aiState = c.a === 'T' ? '🛡️ FRENTE ACORAZADO' : '⚔️ DUELO CUERPO A CUERPO';
                }
            };

            const holdForSheen = m.sheen > 0 && (S1.p.sheen_ad || S1.p.sheen_ap) && m.at <= 0.16 && dist <= rng + 0.35;
            let cast = null;
            if (m.gcd <= 0 && !holdForSheen) {
                for (let idx = 0; idx < m.ab.length; idx++) {
                    const a = m.ab[idx];
                    if (a.cd > 0) continue;
                    const maxReach = (a.f.includes('g') || a.f.includes('p') || a.k === 'hook' || a.k === 'meteor' || a.k === 'mega_proj') ? 7.2 : rng + 1.65;
                    if (dist > maxReach && a.k !== 'summon' && a.k !== 'parry') continue;

                    // Si el rival tiene Escudo de Hechizos, romperlo antes con Q o W en lugar de gastar la R
                    if (idx === 2 && o.spellShield > 0 && (m.ab[0].cd <= 1.4 || m.ab[1].cd <= 1.4)) continue;

                    // Si la Q tiene Stun y está casi lista (<= 0.8s), los Magos esperan para encadenar Q (Stun) -> R (Combo seguro)
                    if (idx === 2 && c.a === 'M' && m.ab[0].s > 0 && m.ab[0].cd <= 0.8 && o.stun <= 0 && o.hp > o.s.hp * 0.35) continue;

                    // Guardar Definitivas de Ejecución hasta que el rival baje del 62% HP (o emergencia)
                    const isExecUlt = idx === 2 && EXECUTE_CHAMPS.has(c.n) && a.s === 0;
                    if (isExecUlt && o.hp > o.s.hp * 0.62 && m.hp > S1.hp * 0.35 && t < 6.0) continue;

                    // Usar Parry/Defensa cuando el rival está cerca o a punto de lanzar su combo
                    if (a.k === 'parry' && dist > 3.2 && m.hp > S1.hp * 0.85) continue;

                    if (a.k === 'heal' && m.hp > S1.hp * 0.82 && a.s <= 0) continue;
                    if (a.s > 0 && o.stun > 0.35 && o.hp > o.s.hp * 0.25) continue;

                    cast = a;
                    cast.slotIdx = idx;
                    cast.isUlt = idx === 2;
                    break;
                }
            }

            if (cast) {
                cast.cd = cast.cd0 * (100 / (100 + S1.haste));
                m.gcd = 0.45;
                m.stacks = Math.min(12, m.stacks + 1);

                // Caso 1: Habilidad de Invocación en el Campo de Batalla (Tibbers, Soldado de Arena, Torreta, Sombra, etc.)
                if (cast.k === 'summon') {
                    const smInfo = SUMMON_CHAMPS[c.n] || { sName: 'Invocación', col: c.col, r: 9 };
                    const sx = Math.max(1.2, Math.min(7.8, (m.x + o.x) * 0.5 + (i === 0 ? -0.4 : 0.4)));
                    const sy = Math.max(0.55, Math.min(2.45, o.y + (Math.random() - 0.5) * 0.5));
                    summons.push({ owner: i, name: smInfo.sName, col: smInfo.col, r: smInfo.r, x: sx, y: sy, life: 5.5, atkCD: 0.25 });
                    m.aiState = `👾 ¡INVOCANDO ${smInfo.sName.toUpperCase()}!`;
                    if (S1.p.sheen_ad || S1.p.sheen_ap) m.sheen = 1;
                    EV.push([t, i, 's', 0, 'summon', `👾 ${cast.n}`, sx, sy]);
                    lg.push([t, i, `👾 ¡${c.n} despliega [${smInfo.sName}] en el campo de batalla!`, 'p']);
                }
                // Caso 2: Habilidad de Bloqueo / Parry / Muro de Viento
                else if (cast.k === 'parry') {
                    m.parry = 1.35;
                    m.sh += S1.hp * 0.08 + 75;
                    if (S1.p.sheen_ad || S1.p.sheen_ap) m.sheen = 1;
                    m.aiState = `🤺 ¡${cast.n.slice(0, 14).toUpperCase()}!`;
                    EV.push([t, i, 'sh', 90, 'shield', `🤺 ¡${cast.n}!`]);
                    lg.push([t, i, `🤺 ¡${c.n} activa [${cast.n}] (Bloqueo y Contraataque)!`, 'heal']);
                }
                // Caso 3: Curación / Escudo Táctico
                else if (cast.k === 'heal') {
                    const hVal = (135 + 0.75 * S1.ap + 0.10 * S1.hp) * cast.m;
                    healUnit(i, hVal);
                    m.sh += hVal * 0.40;
                    if (S1.p.sheen_ad || S1.p.sheen_ap) m.sheen = 1;
                    m.aiState = '💚 ESCUDO Y CURA';
                    if (cast.s > 0) applyStun(i, 1 - i, cast.s, cast.k, cast.n);
                    EV.push([t, i, 's', hVal, 'heal', cast.n]);
                    lg.push([t, i, `💚 ${c.n} usa [${cast.n}] y restaura ${Math.round(hVal)} de vida`, 'heal']);
                }
                // Caso 4: Habilidades Ofensivas, Dashes, Ganchos, Estampidas contra Muro y Definitivas
                else {
                    if ((cast.f.includes('g') || c.n === 'Rengar' && m.inBrush) && !imRanged && dist > 1.2) {
                        const dir = Math.sign(o.x - m.x) || 1;
                        const landX = c.a === 'A' ? (o.x + dir * 0.95) : (o.x - dir * 1.1);
                        const clampedX = Math.max(0.75, Math.min(8.25, landX));
                        EV.push([t, i, 'dash', m.x, clampedX]);
                        m.x = clampedX;
                        m.y = o.y;
                        m.aiState = c.a === 'A' ? '🗡️ ¡BACKSTAB!' : '⚡ ¡EMBESTIDA!';
                    } else if (cast.f.includes('dash_k') && imRanged) {
                        const awayDir = Math.sign(m.x - o.x) || (i === 0 ? -1 : 1);
                        const dashX = Math.max(0.85, Math.min(8.15, m.x + awayDir * 1.15));
                        EV.push([t, i, 'dash', m.x, dashX]);
                        m.x = dashX;
                    } else if ((cast.f.includes('p') || cast.k === 'hook') && dist > 1.35 && o.zhonya <= 0 && o.spellShield <= 0) {
                        const dir = Math.sign(o.x - m.x) || 1;
                        const pullTargetX = imRanged ? o.x - dir * 0.9 : m.x + dir * 1.25;
                        o.x = Math.max(0.75, Math.min(8.25, pullTargetX));
                        o.y = m.y;
                        m.aiState = '🪝 ¡AGARRE!';
                    }

                    if (o.spellShield > 0) {
                        o.spellShield = 0;
                        m.aiState = '🔮 ROMPIENDO VELO';
                        EV.push([t, i, 's', -2, cast.k, '🔮 ¡VELO BLOQUEA!']);
                        lg.push([t, 1 - i, `🔮 ¡El Escudo de Hechizos de ${o.c.n} bloquea ${cast.n}!`, 'p']);
                    } else {
                        if (cast.isUlt && DARK_REALM_ULTS.has(c.n)) {
                            realmFx = { active: 3.6, col: c.col, owner: i };
                        }

                        let scaleDmg = mg ? (155 + 0.90 * S1.ap + 0.35 * (S1.ad - S1.bad)) : (140 + 1.05 * S1.ad + 0.4 * S1.ap);
                        const execBonus = (cast.isUlt && EXECUTE_CHAMPS.has(c.n) && o.hp < o.s.hp * 0.52) ? 1.25 : 1.0;
                        const ccComboBonus = (cast.isUlt && o.stun > 0) ? 1.15 : 1.0;
                        const isTrue = cast.f.includes('tr') || c.pas.t === 'tr' || (cast.isUlt && (c.n === 'Garen' || c.n === 'Darius' || c.n === 'Cho\'Gath' || c.n === 'Pyke'));

                        // Comprobar mecánica de Empuje y Estampida contra el Muro de la Arena
                        let wallSlam = false;
                        if (WALL_SLAM_CHAMPS.has(c.n) && cast.s > 0 && o.zhonya <= 0) {
                            const pushDir = Math.sign(o.x - m.x) || (i === 0 ? 1 : -1);
                            const pushedX = o.x + pushDir * 1.35;
                            if (pushedX <= 1.25 || pushedX >= 7.75) {
                                o.x = pushedX <= 1.25 ? 0.72 : 8.28;
                                wallSlam = true;
                                scaleDmg *= 1.28;
                            } else {
                                o.x = Math.max(0.75, Math.min(8.25, pushedX));
                            }
                        }

                        let d = deal(i, scaleDmg * cast.m * execBonus * ccComboBonus, isTrue ? 't' : (mg ? 'm' : 'p'), execBonus > 1 || ccComboBonus > 1, false);

                        if (d > 0 && S1.p.burst_proc && m.burstCD <= 0) {
                            m.burstCD = 5;
                            d += deal(i, S1.p.burst_proc + 0.15 * S1.ap, mg ? 'm' : 'p');
                        }

                        m.aiState = wallSlam ? '🧱 ¡COMBO MURO!' : (execBonus > 1 ? '💀 ¡EJECUCIÓN R!' : (ccComboBonus > 1 ? '⚡ ¡COMBO CC+R!' : `✨ ${cast.n.slice(0, 14)}`));
                        EV.push([t, i, 's', d, cast.k, (wallSlam ? '🧱 ' : execBonus > 1 ? '💀 ' : '') + cast.n]);
                        if (d > 0) {
                            if (cast.s > 0 || wallSlam) applyStun(i, 1 - i, cast.s + (wallSlam ? 0.70 : 0), cast.k, cast.n, wallSlam);
                            if (cast.f.includes('ps') || c.pas.t === 'vn') o.psn = 4.0;
                            if (cast.f.includes('bn') || S1.p.burn_maxhp || c.pas.t === 'bn') o.burn = 3.5;
                            if (cast.f.includes('sl') || S1.p.slow_spell) o.slw = 3.0;
                            if (c.pas.t === 'sh') m.sh += S1.hp * (c.pas.v / 100);
                            if (S1.p.sheen_ad || S1.p.sheen_ap) m.sheen = 1;
                        }
                        lg.push([t, i, `${c.n} lanza [${cast.n}]: ${d < 0 ? '¡Esquivado!' : Math.round(d) + ' daño' + (wallSlam ? ' (¡CONTRA EL MURO!)' : '')}`, (execBonus > 1 || wallSlam) ? 'crit' : (d < 0 ? 'e' : 'p')]);
                    }
                }
                if (imRanged) performTacticalMove(0.68);
            }
            else if (m.at <= 0 && dist <= rng + 0.28) {
                let effAs = S1.as;
                if (o.s.p.slow_as) effAs *= (1 - o.s.p.slow_as / 100);
                if (m.slw > 0) effAs *= 0.82;
                m.at = 1 / Math.max(0.25, effAs);
                m.aaCount++;

                if (S1.p.navori) {
                    m.ab.forEach(a => a.cd = Math.max(0, a.cd * 0.85));
                }

                let isCrit = Math.random() * 100 < S1.crit;
                if (S1.p.sundered && m.sunderCD <= 0) {
                    isCrit = true;
                    m.sunderCD = 6;
                    healUnit(i, 110 + (S1.hp - m.hp) * 0.08);
                }

                const critMult = isCrit ? (1.75 + (S1.p.cd_inc || 0) / 100) : 1.0;
                const gMult = S1.p.guinsoo || 1.0;

                let rawPhys = S1.ad * critMult;
                if (S1.p.botrk) rawPhys += (o.hp * (S1.p.botrk / 100)) * gMult;
                if (S1.p.titanic) rawPhys += (S1.hp * (S1.p.titanic / 100)) * gMult;
                let usedSheen = false;
                if (m.sheen && S1.p.sheen_ad) { rawPhys += S1.bad * S1.p.sheen_ad; usedSheen = true; m.aiState = '🔱 ¡GOLPE BRILLO!'; }

                if (S1.p.heartsteel && m.hsCD <= 0) {
                    m.hsCD = 6.5;
                    const hsBonus = 90 + S1.hp * 0.05;
                    rawPhys += hsBonus;
                    S1.hp += 60; m.hp += 60;
                    usedSheen = true;
                    m.aiState = '❤️‍🔥 ¡ACERO CORAZÓN!';
                    lg.push([t, i, `❤️‍🔥 ¡Acero de Corazón de ${c.n} resuena (+60 Vida Máx)!`, 'crit']);
                }

                let d = deal(i, rawPhys, 'p', isCrit, true);

                if (d > 0) {
                    let rawMag = ((S1.p.onhit_flat || 0) + S1.ap * (S1.p.onhit_ap || 0)) * gMult;
                    if (m.sheen && S1.p.sheen_ap) { rawMag += S1.bad * 0.75 + S1.ap * S1.p.sheen_ap; usedSheen = true; m.aiState = '🔮 ¡LICHE PROC!'; }
                    if (rawMag > 0) d += Math.max(0, deal(i, rawMag, 'm', false, true));

                    if (m.aaCount % 3 === 0 && (S1.p.kraken || c.pas.t === 'tr')) {
                        const trueDmg = (S1.p.kraken || 0) + (c.pas.t === 'tr' ? o.s.hp * (c.pas.v / 200) : 0);
                        d += Math.max(0, deal(i, trueDmg, 't', false, true));
                        usedSheen = true;
                    }

                    if (m.aaCount % 4 === 0 && (c.n === 'Braum' || c.n === 'Nautilus' || c.n === 'Kennen')) {
                        applyStun(i, 1 - i, 1.0, 'ice', 'Golpes Conmocionantes');
                    }

                    if (c.pas.t === 'vn') o.psn = 3.0;
                    if (S1.p.slow_hit || c.n === 'Ashe') o.slw = 2.2;

                    if (o.s.p.thorn) {
                        const thDmg = (20 + o.s.ar * 0.25) * 100 / (100 + S1.mr);
                        m.hp -= thDmg; o.dmg += thDmg;
                    }
                }
                m.sheen = 0;
                EV.push([t, i, (isCrit || usedSheen) ? 'c' : 'a', d, c.weapon]);
                if (isCrit && d > 0) lg.push([t, i, `💥 ¡${c.n} conecta un CRÍTICO de ${Math.round(d)}!`, 'crit']);
                if (imRanged) performTacticalMove(0.62);
            }
            else {
                performTacticalMove(1.0);
            }

            for (const u of [0, 1]) {
                if (P[u].hp <= 0 && !P[u].usedGA && P[u].s.p.ga) {
                    P[u].usedGA = true;
                    P[u].hp = P[u].s.hp * 0.50;
                    P[u].zhonya = 1.2;
                    P[u].aiState = '👼 ¡RENACIENDO!';
                    EV.push([t, u, 'ga', P[u].hp, 'heal', '👼 ¡ÁNGEL GUARDIÁN!']);
                    lg.push([t, u, `👼 ¡${P[u].c.n} renace con el 50% de vida gracias a Ángel de la Guarda!`, 'heal']);
                }
            }
        }

        F.push([
            t, P[0].hp, P[1].hp, P[0].x, P[1].x,
            P[0].stun, P[1].stun, P[0].psn, P[1].psn,
            P[0].burn, P[1].burn, P[0].slw, P[1].slw,
            P[0].sh, P[1].sh, P[0].y, P[1].y,
            P[0].zhonya, P[1].zhonya, P[0].z, P[1].z, P[0].spellShield, P[1].spellShield,
            P[0].ab[0].cd, P[0].ab[2].cd, P[1].ab[0].cd, P[1].ab[2].cd,
            P[0].maxStun || 1, P[1].maxStun || 1,
            P[0].aiState, P[1].aiState,
            P[0].ab[1].cd, P[1].ab[1].cd,
            fruits[0].active ? 1 : 0, fruits[1].active ? 1 : 0,
            P[0].inBrush + P[1].inBrush * 2 + (P[0].parry > 0 ? 4 : 0) + (P[1].parry > 0 ? 8 : 0),
            fireRadius,
            summons.map(sm => ({ owner: sm.owner, name: sm.name, col: sm.col, r: sm.r, x: sm.x, y: sm.y })),
            realmFx.active > 0 ? realmFx.owner : -1
        ]);
    }

    const w = P[0].hp > P[1].hp ? 0 : 1;
    return { F, lg, w, t, P, EV };
}

function drawChampionOriginal(ctx, c, facing, time, isMoving, atkProg, isZhonya, isStunned, castProg) {
    ctx.save();
    ctx.scale(facing, 1);

    const v = CHAMP_VIS[c.n] || {};
    const prop = v.prop || '';
    const helm = v.helm || '';
    const hs = v.hs || 'short';
    const bodyType = v.body || '';
    const col = isZhonya ? '#fbbf24' : (c.col || '#38bdf8');
    const col2 = isZhonya ? '#92400e' : (v.col2 || '#0b1324');
    const dark = isZhonya ? '#78350f' : '#09101d';
    const metal = isZhonya ? '#fde047' : '#cbd5e1';
    const gold = isZhonya ? '#fef08a' : '#c8aa6e';
    const hairCol = isZhonya ? '#fde047' : (v.hair || col);
    const skin = isZhonya ? '#fcd34d' : (v.skin || (c.race === 'yordle' ? '#e09f5a' : c.race === 'beast' ? '#64748b' : c.feat === 'void' ? '#c4b5fd' : '#f3d8c2'));

    if (c.race === 'yordle' && !bodyType && prop !== 'skaarl_mount') {
        ctx.scale(0.82, 0.82); ctx.translate(0, 8);
    } else if (c.race === 'titan' || bodyType === 'willump_yeti' || bodyType === 'tristy_mech' || bodyType === 'chogath_terror' || bodyType === 'malphite_rock') {
        ctx.scale(1.15, 1.15); ctx.translate(0, -5);
    }

    const walk = (isMoving && !isStunned) ? Math.sin(time * 16) * 9.5 : 0;
    const breath = isStunned ? Math.sin(time * 24) * 1.5 : Math.sin(time * 4.2) * 2.0;
    const isFloating = c.race === 'ascended' || c.race === 'serpent' || bodyType === 'yuumi_cat' || bodyType === 'velkoz_eye' || bodyType === 'anivia_bird' || bodyType === 'aurelion_dragon' || prop === 'hover_stage';
    const floatY = isFloating ? Math.sin(time * 3.5) * 6 - 7 : -Math.abs(walk) * 0.25;
    const lean = isStunned ? -0.16 : (atkProg > 0 ? Math.sin(atkProg * Math.PI) * 0.15 : (isMoving ? 0.08 : 0));
    const swing = atkProg > 0 ? Math.sin(atkProg * Math.PI) : 0;

    ctx.translate(0, floatY + breath);
    ctx.rotate(lean);

    // 0. Aura radial de lanzamiento o Ascensión
    if (castProg > 0 || c.race === 'ascended' || c.feat === 'void') {
        const auraR = 34 + (castProg > 0 ? castProg * 16 : Math.sin(time * 5) * 4);
        const aGrad = ctx.createRadialGradient(0, -18, 4, 0, -18, auraR);
        aGrad.addColorStop(0, col + (castProg > 0 ? '88' : '44'));
        aGrad.addColorStop(1, 'transparent');
        ctx.fillStyle = aGrad;
        ctx.beginPath(); ctx.arc(0, -18, auraR, 0, Math.PI * 2); ctx.fill();
    }

    // ============================================================================
    // A. MODELOS ANATÓMICOS ESPECIALES (Criaturas, Dragones, Aves, Bestias, Mechas)
    // ============================================================================
    if (bodyType === 'anivia_bird') {
        // Anivia: Criofénix de hielo real con alas desplegadas, cola y pico
        const flap = Math.sin(time * 8) * 14;
        ctx.fillStyle = '#38bdf8'; ctx.strokeStyle = '#e0f2fe'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-4, -18); ctx.quadraticCurveTo(-48, -56 + flap, -42, -8); ctx.quadraticCurveTo(-20, -4, -4, -12);
        ctx.moveTo(4, -18); ctx.quadraticCurveTo(38, -52 - flap * 0.7, 34, -8); ctx.quadraticCurveTo(18, -4, 4, -12);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#0284c7';
        ctx.beginPath(); ctx.moveTo(-8, -6); ctx.lineTo(-34, 18); ctx.lineTo(-18, 22); ctx.lineTo(0, 2); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#bae6fd';
        ctx.beginPath(); ctx.ellipse(0, -16, 14, 10, -0.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.arc(11, -26, 8, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#e0f2fe';
        ctx.beginPath(); ctx.moveTo(7, -32); ctx.lineTo(-4, -44); ctx.lineTo(13, -33); ctx.fill();
        ctx.fillStyle = '#facc15';
        ctx.beginPath(); ctx.moveTo(18, -28); ctx.lineTo(28, -25); ctx.lineTo(18, -22); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#ffffff'; ctx.fillRect(12, -28, 3, 2.5);
        ctx.restore(); return;
    }

    if (bodyType === 'aurelion_dragon') {
        // Aurelion Sol: Dragón cósmico serpentino + corona dorada + 3 estrellas orbitando
        ctx.strokeStyle = '#1d4ed8'; ctx.lineWidth = 13; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(6, -24);
        ctx.bezierCurveTo(-28, -14, 18 + Math.sin(time * 5) * 10, 12, -28, 24);
        ctx.stroke();
        ctx.strokeStyle = '#60a5fa'; ctx.lineWidth = 5; ctx.stroke();
        ctx.fillStyle = '#1e3a8a'; ctx.strokeStyle = gold; ctx.lineWidth = 1.8;
        ctx.beginPath(); ctx.ellipse(10, -34, 13, 8, 0.1, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#fef08a';
        ctx.beginPath(); ctx.moveTo(4, -40); ctx.lineTo(-14, -56); ctx.lineTo(10, -41); ctx.fill();
        ctx.fillStyle = '#38bdf8'; ctx.fillRect(12, -36, 4, 3);
        const sCols = ['#fde047', '#f97316', '#38bdf8'];
        for (let o = 0; o < 3; o++) {
            const oa = time * 4.2 + o * (Math.PI * 2 / 3);
            const ox = Math.cos(oa) * 32, oy = -14 + Math.sin(oa) * 12;
            ctx.fillStyle = sCols[o]; ctx.shadowColor = sCols[o]; ctx.shadowBlur = 10;
            ctx.beginPath(); ctx.arc(ox, oy, 5.5, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
        }
        ctx.restore(); return;
    }

function drawChampionHD(ctx,c,facing,time,isMoving,attackPhase,isZhonya,isStunned,castPhase){
 const profile=CHAMPION_MOTION[c.n]||{motion:'biped',attack:'melee',effect:'burst',tempo:1,weight:1,tilt:0};
 time*=profile.tempo;
 const a=Math.max(0,Math.min(1,attackPhase||0)),sp=Math.max(0,Math.min(1,castPhase||0));
 const anticipation=a<.34?a/.34:1, strike=a<.34?0:Math.min(1,(a-.34)/.28), recovery=a<.62?0:(a-.62)/.38;
 const hit=Math.sin(strike*Math.PI),walk=isMoving?Math.sin(time*10.5):0;
 ctx.save();
 // Continuous whole-body motion: locomotion, anticipation, impact and recovery.
 ctx.translate(facing*(hit*9-anticipation*3+recovery*2),isMoving?-Math.abs(walk)*3:Math.sin(time*2.8)*.8);
 ctx.rotate(isStunned?-.14:(-facing*anticipation*.045+facing*hit*.085-facing*recovery*.03));
 const breath=1+Math.sin(time*3)*.012, squash=1-hit*.045+sp*.025;
 ctx.scale(breath*(1+hit*.06),squash/breath);

 // Per-champion motion profile augments, but never replaces, the original silhouette.
 if(profile.motion==='hover')ctx.translate(0,-6-Math.sin(time*3.4)*4);
 if(profile.motion==='heavy')ctx.scale(1.08,1.04);
 if(profile.motion==='beast')ctx.rotate(facing*(isMoving?walk*.025:0));
 if(profile.motion==='fly')ctx.translate(0,-8-Math.sin(time*4)*5);
 ctx.rotate(facing*profile.tilt*(.25+.75*hit));
 drawChampionOriginal(ctx,c,facing,time,isMoving,a,isZhonya,isStunned,sp);
 // Ability aura follows the complete cast envelope and never hides the silhouette.
 if(sp>.02){const col=c.col||'#64d8ff';ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=.12+.32*Math.sin(sp*Math.PI);ctx.strokeStyle=col;ctx.lineWidth=1.5+sp*3;ctx.beginPath();ctx.ellipse(0,-18,27+sp*18,39+sp*13,0,0,Math.PI*2);ctx.stroke();ctx.restore()}
 if(sp>.04){ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=.18+.35*Math.sin(sp*Math.PI);ctx.strokeStyle=c.col||'#7dd3fc';ctx.fillStyle=c.col||'#7dd3fc';ctx.lineWidth=2.2;
  const R=20+sp*28;
  if(profile.effect==='arc'){ctx.beginPath();ctx.arc(facing*8,-18,R,-1.8,.8);ctx.stroke()}
  else if(profile.effect==='beam'){ctx.beginPath();ctx.moveTo(facing*15,-23);ctx.lineTo(facing*(55+sp*45),-23);ctx.stroke()}
  else if(profile.effect==='cone'){ctx.beginPath();ctx.moveTo(facing*12,-20);ctx.lineTo(facing*(58+sp*35),-42-sp*10);ctx.lineTo(facing*(58+sp*35),2+sp*10);ctx.closePath();ctx.fill()}
  else if(profile.effect==='ring'){ctx.beginPath();ctx.arc(0,-15,R,0,Math.PI*2);ctx.stroke()}
  else if(profile.effect==='spiral'){ctx.beginPath();for(let q=0;q<28;q++){const rr=q/27*R,aa=q*.7+sp*5;const xx=Math.cos(aa)*rr,yy=-18+Math.sin(aa)*rr*.55;q?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}ctx.stroke()}
  else if(profile.effect==='nova'){for(let q=0;q<8;q++){const aa=q*Math.PI/4;ctx.beginPath();ctx.moveTo(Math.cos(aa)*8,-18+Math.sin(aa)*8);ctx.lineTo(Math.cos(aa)*R,-18+Math.sin(aa)*R);ctx.stroke()}}
  else if(profile.effect==='trail'){for(let q=0;q<4;q++){ctx.beginPath();ctx.moveTo(-facing*(10+q*8),-5-q*7);ctx.lineTo(-facing*(35+sp*30+q*9),-5-q*7);ctx.stroke()}}
  else {ctx.beginPath();ctx.arc(facing*25,-20,8+sp*20,0,Math.PI*2);ctx.fill()}

 ctx.restore();
}

function draftShowcase() {
    const cv = $('#draftCv'); if (!cv || G.scr !== 'draft') return;
    const W = cv.clientWidth || 640, H = 132, dp = Math.min(2, window.devicePixelRatio || 1);
    cv.width = W * dp; cv.height = H * dp;
    const x = cv.getContext('2d');
    let t0 = performance.now();

    function loop(now) {
        if (G.scr !== 'draft' || !$('#draftCv')) return;
        const ct = (now - t0) / 1000;
        x.setTransform(dp, 0, 0, dp, 0, 0);
        x.clearRect(0, 0, W, H);

        const bg = x.createLinearGradient(0, 0, W, H);
        bg.addColorStop(0, '#041226'); bg.addColorStop(0.5, '#091f3a'); bg.addColorStop(1, '#1a0918');
        x.fillStyle = bg; x.fillRect(0, 0, W, H);

        const c0 = G.pick0 || CH.find(c => c.n === 'Ashe') || CH[0];
        const c1 = G.pick1 || CH.find(c => c.n === 'Darius') || CH[1];

        [c0, c1].forEach((ch, i) => {
            const cx = i === 0 ? W * 0.24 : W * 0.76;
            const cy = H * 0.76;
            x.strokeStyle = i === 0 ? '#0ac8b9' : '#e84057'; x.lineWidth = 1.4;
            x.beginPath(); x.ellipse(cx, cy + 25, 44, 10, 0, 0, Math.PI * 2); x.stroke();
            x.save();
            x.translate(cx, cy);
            const demoSwing = (Math.sin(ct * 2.5 + i * 2) > 0.72) ? (Math.sin(ct * 2.5 + i * 2) - 0.72) * 3.5 : 0;
            drawChampionHD(x, ch, i === 0 ? 1 : -1, ct, false, demoSwing, false, false, 0);
            x.restore();
            x.fillStyle = i === 0 ? '#0ac8b9' : '#fda4af';
            x.font = 'bold 11px sans-serif'; x.textAlign = 'center';
            x.fillText(`${ch.n} (${AR[ch.a][0]})`, cx, 18);
        });

        x.fillStyle = '#c8aa6e'; x.font = "800 19px 'Beaufort for LOL', serif"; x.textAlign = 'center';
        x.fillText('VS', W / 2, H * 0.54);

        RAF = requestAnimationFrame(loop);
    }
    RAF = requestAnimationFrame(loop);
}

        x.fillStyle = 'rgba(1,10,19,0.82)';

                if(G.scr==='fight'){G.sc[R.w]++;G.scr='res';recordCurrentResult();render();}

        }
        RAF = requestAnimationFrame(drawLoop);
    }
    RAF = requestAnimationFrame(drawLoop);
}

function startMatch(mode, diff) {
    G = { mode, diff, sc: [0, 0], scr: mode === 'draft' ? 'draft' : 'shop', q: '', cSearch: '', spd: 1, paused: false };

function nextRound() {

const q=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function sb(path,opt={}){const h={apikey:SB_KEY,'Content-Type':'application/json',...(opt.headers||{})};if(NET.session?.access_token)h.Authorization='Bearer '+NET.session.access_token;const r=await fetch(SB_URL+path,{...opt,headers:h});const t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw Error(d?.msg||d?.message||d?.error_description||'Error '+r.status);return d}
function emailOf(u){return u.trim().toLowerCase()+'@users.build-arena.invalid'}
function account(){q('#account').innerHTML=NET.user?`<span>● ${esc(NET.user.username)}</span><button data-net="out">SALIR</button>`:`<button data-net="login">SIGN IN</button><button data-net="signup">SIGN UP</button>`}
function auth(mode){q('#auth').hidden=false;q('#auth').innerHTML=`<div class="auth-back"><form class="auth-card" id="authForm"><div class="tabs"><button type="button" data-net="login">SIGN IN</button><button type="button" data-net="signup">SIGN UP</button><button type="button" data-net="close">×</button></div><h2>${mode==='signup'?'Crear usuario':'Iniciar sesión'}</h2><label>Nombre de usuario<input id="au" minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+" required></label><label>Contraseña<input id="ap" type="password" minlength="6" required></label>${mode==='signup'?'<label>Repetir contraseña<input id="ar" type="password" minlength="6" required></label>':''}<div id="am" class="notice">Usuario y contraseña. No se necesita correo.</div><button type="submit">${mode==='signup'?'SIGN UP':'SIGN IN'}</button></form></div>`;q('#authForm').dataset.mode=mode}
async function submitAuth(e){e.preventDefault();const mode=e.target.dataset.mode,u=q('#au').value.trim(),p=q('#ap').value,m=q('#am');try{if(!/^[A-Za-z0-9_]{3,20}$/.test(u))throw Error('Usuario no válido');if(mode==='signup'&&p!==q('#ar').value)throw Error('Las contraseñas no coinciden');m.textContent='Conectando...';const path=mode==='signup'?'/auth/v1/signup':'/auth/v1/token?grant_type=password';const body=mode==='signup'?{email:emailOf(u),password:p,data:{username:u}}:{email:emailOf(u),password:p};const d=await sb(path,{method:'POST',body:JSON.stringify(body)});NET.session=d;NET.user={id:d.user.id,username:d.user.user_metadata?.username||u};localStorage.setItem('ba_session',JSON.stringify(d));localStorage.setItem('ba_user',JSON.stringify(NET.user));q('#auth').hidden=true;account();showPage('profile')}catch(x){m.textContent=x.message;m.className='notice error'}}
const DDRAGON='https://ddragon.leagueoflegends.com/cdn/16.20.1';
const CHAMPION_SLUG={"Wukong":"MonkeyKing","Cho'Gath":"Chogath","Kha'Zix":"Khazix","Vel'Koz":"Velkoz","Kai'Sa":"Kaisa","Rek'Sai":"RekSai","LeBlanc":"Leblanc","Nunu y Willump":"Nunu","Bel'Veth":"Belveth","K'Sante":"KSante","Renata Glasc":"Renata","Dr. Mundo":"DrMundo","Jarvan IV":"JarvanIV","Lee Sin":"LeeSin","Master Yi":"MasterYi","Miss Fortune":"MissFortune","Tahm Kench":"TahmKench","Twisted Fate":"TwistedFate","Xin Zhao":"XinZhao","Aurelion Sol":"AurelionSol"};
const champSlug=n=>CHAMPION_SLUG[n]||n.replace(/[^A-Za-z0-9]/g,'');
const championPortrait=n=>`${DDRAGON}/img/champion/${champSlug(n)}.png`;
function itemVisual(name){const it=IT.find(x=>x.n===name||x.originalName===name);return it?.id?`<span class="meta-icon"><img src="${DDRAGON}/img/item/${it.id}.png" alt="${esc(name)}" onerror="this.parentElement.textContent='◈'"></span>`:`<span class="meta-icon">◈</span>`}
function metaVisual(kind,name,avatar){
 if(kind==='champion')return `<span class="meta-icon"><img src="${championPortrait(name)}" alt="${esc(name)}" onerror="this.parentElement.textContent='◆'"></span>`;
 if(kind==='user'){const ch=avatar||'Aatrox';return `<span class="meta-icon"><img src="${championPortrait(ch)}" alt="${esc(ch)}" title="Icono: ${esc(ch)}" onerror="this.parentElement.textContent='${esc(name).slice(0,2).toUpperCase()}'"></span>`}
 return itemVisual(name)
}
function allGameItems(kind){return IT.filter(x=>kind==='boots'?x.c==='B':x.c!=='B').map(x=>({item_name:x.n,slot:x.c==='B'?1:2,is_boots:x.c==='B',matches:0,raw_win_rate:0,adjusted_win_rate:50,sample_status:'SIN DATOS'}))}
async function meta(kind='champion'){
 q('#portal').innerHTML=`<section class="page"><h1>META GLOBAL</h1><div class="meta-tabs"><button data-meta="champion">CAMPEONES</button><button data-meta="item">OBJETOS</button><button data-meta="boots">BOTAS</button><button data-meta="user">USUARIOS</button></div><p class="meta-note">Iconos oficiales de Data Dragon. Win rate ajustado por muestra.</p><div id="ml" class="notice">Cargando...</div></section>`;
 try{
  const view=kind==='champion'?'champion_meta':kind==='user'?'user_meta':'item_meta';
  const cols=kind==='champion'?'champion,matches,raw_win_rate,adjusted_win_rate,sample_status':kind==='user'?'username,avatar_champion,matches,wins,raw_win_rate,adjusted_win_rate,sample_status':'item_name,slot,is_boots,matches,raw_win_rate,adjusted_win_rate,sample_status';
  let url=`/rest/v1/${view}?select=${cols}&order=adjusted_win_rate.desc&limit=500`;
  if(kind==='boots')url+=`&is_boots=eq.true`;else if(kind==='item')url+=`&is_boots=eq.false`;
  let d=await sb(url);
  if(kind==='item'||kind==='boots'){const stats=new Map(d.map(x=>[x.item_name,x]));d=allGameItems(kind).map(x=>stats.get(x.item_name)||x).sort((a,b)=>b.adjusted_win_rate-a.adjusted_win_rate||b.matches-a.matches||a.item_name.localeCompare(b.item_name))}
  q('#ml').className='meta-list';q('#ml').innerHTML=d.length?d.map((x,i)=>{const sc=+x.adjusted_win_rate,t=x.matches<10?'?':sc>=60?'S':sc>=56?'A':sc>=50?'B':sc>=46?'C':'D',name=x.champion||x.item_name||x.username;return `<div class="meta-row"><b>#${i+1}</b><span class="tier">${t}</span>${metaVisual(kind==='boots'?'item':kind,name,x.avatar_champion)}<strong>${esc(name)}</strong><span>${x.matches?Number(x.raw_win_rate).toFixed(1)+'% WR':'Sin datos'}</span><small>${x.matches} partidas${x.wins!=null?' · '+x.wins+' victorias':''} · ${x.sample_status}</small></div>`}).join(''):'Todavía no hay partidas registradas.'
 }catch(e){q('#ml').textContent='Error: '+e.message}
}
async function saveAvatar(champion){try{await sb('/rest/v1/profiles?id=eq.'+NET.user.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({avatar_champion:champion})});NET.user.avatar_champion=champion;localStorage.setItem('ba_user',JSON.stringify(NET.user));profile()}catch(e){alert('No se pudo guardar: '+e.message)}}
async function profile(){
 if(!NET.user){q('#portal').innerHTML='<section class="page"><h1>PERFIL</h1><p>Inicia sesión para guardar tus partidas.</p><button data-net="signup">CREAR CUENTA</button></section>';return}
 q('#portal').innerHTML='<section class="page"><h1>'+esc(NET.user.username)+'</h1><div id="ps" class="notice">Cargando estadísticas...</div></section>';
 try{const [prof]=await sb('/rest/v1/profiles?select=username,avatar_champion&id=eq.'+NET.user.id);const d=await sb('/rest/v1/matches?select=winner_side,player_champion,enemy_champion,created_at&user_id=eq.'+NET.user.id+'&order=created_at.desc&limit=100');const w=d.filter(x=>x.winner_side==='player').length,current=prof?.avatar_champion||'Aatrox';NET.user.avatar_champion=current;q('#ps').className='';q('#ps').innerHTML=`<div class="profile-avatar"><img src="${championPortrait(current)}"><div><b>Icono de usuario: ${esc(current)}</b><p>Elige el campeón que aparecerá en la tier list de usuarios.</p><select id="avatarSelect">${CH.map(c=>`<option ${c.n===current?'selected':''}>${esc(c.n)}</option>`).join('')}</select><button data-save-avatar="1">GUARDAR ICONO</button></div></div><div class="stats"><article><b>${d.length}</b>Partidas</article><article><b>${w}</b>Victorias</article><article><b>${d.length?Math.round(w/d.length*100):0}%</b>Win rate</article></div>`}catch(e){q('#ps').textContent=e.message}}
function showPage(p){const app=q('#app'),portal=q('#portal');if(p==='game'){portal.innerHTML='';portal.hidden=true;app.hidden=false}else{app.hidden=true;portal.hidden=false;p==='meta'?meta():profile()}}
async function saveOnlineMatch(payload,items){if(!NET.user)return;const rows=await sb('/rest/v1/matches?select=id',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({...payload,user_id:NET.user.id})});await sb('/rest/v1/match_items',{method:'POST',body:JSON.stringify(items.map(x=>({...x,match_id:rows[0].id})))})}
let lastSavedResult=null;
async function recordCurrentResult(){
 if(!NET.user||!G?.R||!G?.ch||!G?.it)return;
 const fingerprint=[G.ch[0].n,G.ch[1].n,G.R.t,G.R.w,G.sc.join('-')].join('|');if(lastSavedResult===fingerprint)return;lastSavedResult=fingerprint;
 const clientId=crypto.randomUUID?crypto.randomUUID():('00000000-0000-4000-8000-'+String(Date.now()).padStart(12,'0').slice(-12));
 const p0=G.R.P?.[0]||{},p1=G.R.P?.[1]||{};
 const payload={game_version:'17.1-online',simulation_version:'argon-online',mode:G.mode||'aram',difficulty:Number(G.diff||1),duration_seconds:Math.max(1,Number(G.R.t||1)),player_champion:G.ch[0].n,enemy_champion:G.ch[1].n,winner_side:G.R.w===0?'player':'enemy',player_damage:Math.round(p0.dmg||0),enemy_damage:Math.round(p1.dmg||0),player_healing:Math.round(p0.heal||0),enemy_healing:Math.round(p1.heal||0),player_mitigation:Math.round(p0.mit||0),enemy_mitigation:Math.round(p1.mit||0),event_count:G.R.EV?.length||0,client_match_id:clientId,is_valid:true};
 const items=[...(G.it[0]||[]).map((it,i)=>({side:'player',slot:i+1,item_name:it.n,is_boots:i===0})),...(G.it[1]||[]).map((it,i)=>({side:'enemy',slot:i+1,item_name:it.n,is_boots:i===0}))];
 try{await saveOnlineMatch(payload,items);showToast?.('Partida sincronizada con el meta','ok')}catch(e){console.error('No se pudo sincronizar',e);}
}

document.addEventListener('click',e=>{if(e.target.dataset.saveAvatar)saveAvatar(q('#avatarSelect').value);const p=e.target.dataset.page,n=e.target.dataset.net,m=e.target.dataset.meta;if(p)showPage(p);if(m)meta(m);if(n==='login')auth('signin');if(n==='signup')auth('signup');if(n==='close')q('#auth').hidden=true;if(n==='out'){NET={session:null,user:null};localStorage.removeItem('ba_session');localStorage.removeItem('ba_user');account();showPage('game')}});document.addEventListener('submit',e=>{if(e.target.id==='authForm')submitAuth(e)});account();showPage('game');
</script></body>
</html>
