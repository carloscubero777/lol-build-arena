<meta name="theme-color" content="#c8aa6e">
<link href="https://fonts.googleapis.com/css2?family=Beaufort+for+LOL:wght@400;700;800&family=Spiegel:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { 
    --bg: #010a13; --pn: #091428; --pn2: #0a182e; --tx: #f0e6d2; --mu: #a09b8c; 
    --gd: #c8aa6e; --gd-light: #f0e6d2; --gd-dark: #785a28; --ln: #3c3c41; 
    --ok: #0ac8b9; --bd: #e84057; --hx: #0397ab; --mg: #b794ff; --cr: #ffd34d;
    box-sizing: border-box; 
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { 
    background: radial-gradient(circle at 50% 0%, #0d2038 0%, #010a13 70%);
    color: var(--tx); font: 13px/1.4 'Spiegel', system-ui, -apple-system, sans-serif; 
    overflow-x: hidden; touch-action: manipulation; min-height: 100vh;
}
#app { max-width: 720px; margin: 0 auto; padding: 12px 12px 135px; }
h1, h2, h3, .hd { font-family: 'Beaufort for LOL', Georgia, serif; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
button, input { font: inherit; color: inherit; border: none; outline: none; background: transparent; }
button { cursor: pointer; }

.top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--gd-dark); padding: 8px 4px 10px; margin-bottom: 12px; background: linear-gradient(90deg, transparent, rgba(3,151,171,0.08), transparent); }
.top-bar .tag { color: var(--hx); font-weight: 700; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
.top-bar .sc { font-family: 'Beaufort for LOL', serif; font-size: 24px; color: var(--gd); text-shadow: 0 0 12px rgba(200,170,110,0.5); }

.duels { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
@media (max-width: 520px) { .duels { grid-template-columns: 1fr; } }
.duel { background: linear-gradient(180deg, rgba(16,31,54,0.95) 0%, rgba(4,10,20,0.98) 100%); border: 1px solid var(--ln); border-radius: 6px; padding: 10px; text-align: center; position: relative; box-shadow: 0 6px 16px rgba(0,0,0,0.6); }
.duel.pl { border-top: 3px solid var(--ok); }
.duel.en { border-top: 3px solid var(--bd); }
.duel-hdr { display: flex; align-items: center; gap: 8px; text-align: left; margin-bottom: 8px; }
.pt { width: 48px; height: 48px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 26px; border: 2px solid var(--gd); background: radial-gradient(circle, #1a324a, #010a13); box-shadow: 0 0 12px rgba(200,170,110,0.25); position: relative; }
.pt .lv-badge { position: absolute; bottom: -4px; right: -4px; background: #010a13; border: 1px solid var(--gd); color: var(--gd); font-size: 9px; font-weight: 800; padding: 1px 4px; border-radius: 10px; }
.duel-title b { display: block; font-size: 15px; color: var(--gd-light); font-family: 'Beaufort for LOL', serif; line-height: 1.1; }
.duel-title small { display: block; color: var(--hx); font-size: 10px; font-weight: 700; text-transform: uppercase; }
.duel-pas { font-size: 10px; color: var(--mu); background: rgba(0,0,0,0.35); padding: 4px 6px; border-radius: 4px; margin-bottom: 6px; text-align: left; border-left: 2px solid var(--gd); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.duel-abs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-bottom: 8px; font-size: 9px; text-align: left; }
.duel-abs span { background: rgba(3,151,171,0.08); border: 1px solid rgba(3,151,171,0.25); border-radius: 3px; padding: 3px 4px; color: var(--tx); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.duel-abs span b { color: var(--gd); }
.arena-hud { display: flex; justify-content: space-between; gap: 6px; margin-bottom: 6px; font-size: 10.5px; background: rgba(9,20,40,0.9); border: 1px solid var(--gd-dark); border-radius: 5px; padding: 5px 10px; color: var(--gd-light); flex-wrap: wrap; }
.arena-hud span { display: inline-flex; align-items: center; gap: 4px; }

.st-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px 6px; font-size: 10px; text-align: left; margin-bottom: 8px; background: rgba(0,0,0,0.4); padding: 6px; border-radius: 4px; border: 1px solid rgba(200,170,110,0.12); }
.st-grid div { display: flex; justify-content: space-between; align-items: center; } 
.st-grid span { color: var(--mu); }
.st-grid b { font-size: 11px; color: var(--tx); }
.st-grid em { color: #22c55e; font-style: normal; font-size: 10px; margin-left: 2px; }

.sl { display: flex; gap: 4px; justify-content: center; }
.sl button { width: 34px; height: 34px; border: 1px solid var(--ln); background: #010a13; border-radius: 4px; display: grid; place-items: center; font-size: 18px; position: relative; transition: 0.15s; }
.sl button.filled { border-color: var(--gd-dark); background: radial-gradient(circle, #13253a, #040a12); cursor: pointer; }
.sl button.filled:hover, .sl button.filled:focus { border-color: var(--gd); transform: translateY(-2px); box-shadow: 0 0 8px rgba(200,170,110,0.4); }

.shop-bar { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
.search-in { flex: 1; background: var(--pn); border: 1px solid var(--ln); border-radius: 4px; padding: 7px 10px; color: var(--tx); font-size: 12px; }
.search-in:focus { border-color: var(--gd); }
.fl { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 8px; scrollbar-width: none; }
.fl::-webkit-scrollbar { display: none; }
.fl button { flex: none; border: 1px solid var(--ln); background: var(--pn); color: var(--mu); border-radius: 4px; padding: 6px 11px; font-family: 'Beaufort for LOL', serif; font-size: 11px; letter-spacing: 0.8px; text-transform: uppercase; transition: 0.2s; }
.fl button.on { background: rgba(200,170,110,0.18); color: var(--gd); border-color: var(--gd); box-shadow: 0 0 8px rgba(200,170,110,0.25); }

.shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(205px, 1fr)); gap: 8px; max-height: 420px; overflow-y: auto; padding-right: 2px; }
.it { text-align: left; background: linear-gradient(145deg, #0b192e, #050d1a); border: 1px solid var(--ln); border-radius: 5px; padding: 9px; transition: 0.15s; cursor: pointer; position: relative; display: flex; flex-direction: column; }
.it:hover { border-color: var(--gd-dark); background: #0e2038; }
.it.sel { border-color: var(--gd); box-shadow: 0 0 12px rgba(200,170,110,0.35); background: rgba(200,170,110,0.1); }
.it.own { opacity: 0.28; pointer-events: none; filter: grayscale(1); }
.it-top { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.it .e { font-size: 24px; width: 34px; height: 34px; display: grid; place-items: center; background: #010a13; border: 1px solid var(--gd-dark); border-radius: 4px; flex: none; } 
.it b { font-size: 13px; color: var(--gd); line-height: 1.15; font-family: 'Beaufort for LOL', serif; }
.it .rec { font-size: 9px; color: var(--ok); text-transform: uppercase; font-weight: 700; display: block; }
.it p { font-size: 11px; color: #c4b998; line-height: 1.3; margin-bottom: 7px; flex-grow: 1; }
.tg { display: flex; flex-wrap: wrap; gap: 3px; margin-top: auto; } 
.tg i { font-style: normal; font-size: 9.5px; background: #010a13; border: 1px solid rgba(3,151,171,0.35); border-radius: 2px; padding: 1px 4px; color: var(--hx); font-weight: 600; }

.buy { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(1,10,19,0.96); border-top: 2px solid var(--gd); padding: 10px 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; backdrop-filter: blur(10px); z-index: 100; box-shadow: 0 -6px 24px rgba(0,0,0,0.75); }
.btn { border: 1px solid var(--gd); border-radius: 4px; padding: 9px 16px; font-family: 'Beaufort for LOL', serif; font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; transition: 0.2s; cursor: pointer; }
.btn-buy { background: linear-gradient(180deg, #e6c883 0%, #9f7928 100%); color: #010a13; border: 1px solid #f0e6d2; box-shadow: 0 0 12px rgba(200,170,110,0.4); }
.btn-buy:hover { filter: brightness(1.12); box-shadow: 0 0 18px rgba(200,170,110,0.7); }
.btn-ghost { background: rgba(200,170,110,0.08); color: var(--gd); }
.btn-ghost:hover, .btn-ghost.on { background: rgba(200,170,110,0.25); color: #fff; border-color: #fff; }
.btn-full { width: 100%; display: block; text-align: center; }

canvas#cv { width: 100%; display: block; border-radius: 6px; border: 1px solid var(--gd); background: #010a13; margin-bottom: 10px; box-shadow: 0 0 28px rgba(3,151,171,0.28); }
canvas#shopCv { width: 100%; display: block; border-radius: 6px; border: 1px solid var(--gd-dark); background: #010a13; margin-bottom: 10px; box-shadow: 0 4px 16px rgba(0,0,0,0.65); }
.ctl-row { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.ctl-row button { flex: 1; padding: 7px 6px; font-size: 12px; min-width: 72px; }

.log { background: #030912; border: 1px solid var(--ln); border-radius: 6px; height: 155px; overflow-y: auto; padding: 8px 10px; font-size: 11.5px; font-family: ui-monospace, monospace; line-height: 1.45; }
.log div { padding: 3px 0; border-bottom: 1px dashed rgba(255,255,255,0.05); } 
.log .p { color: var(--ok); } .log .e { color: var(--bd); } 
.log .crit { color: #ffd34d; font-weight: bold; } 
.log .venom { color: #4ade80; } .log .burn { color: #fb923c; }
.log .stun { color: #facc15; font-weight: 700; background: rgba(250,204,21,0.08); padding-left: 4px; border-left: 2px solid #facc15; }
.log .heal { color: #34d399; }

.card { background: linear-gradient(180deg, #0b192e 0%, #050c18 100%); border: 1px solid var(--ln); border-radius: 6px; padding: 14px; margin-bottom: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
.champ-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; max-height: 360px; overflow-y: auto; margin-top: 8px; padding: 4px; background: rgba(0,0,0,0.35); border-radius: 4px; }
.ch-pick { background: var(--pn); border: 1px solid var(--ln); border-radius: 4px; padding: 6px 4px; text-align: center; cursor: pointer; transition: 0.15s; font-size: 11px; }
.ch-pick:hover { border-color: var(--gd); transform: translateY(-2px); }
.ch-pick.sel { border-color: var(--ok); background: rgba(10,200,185,0.18); box-shadow: 0 0 10px rgba(10,200,185,0.35); }
.ch-pick.sel-en { border-color: var(--bd); background: rgba(232,64,87,0.18); box-shadow: 0 0 10px rgba(232,64,87,0.35); }
.ch-pick span { display: block; font-size: 22px; margin-bottom: 2px; } .champ-face{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}.ch-pick span{width:42px;height:42px;margin:0 auto 4px;border-radius:50%;overflow:hidden;border:1px solid var(--gd-dark)}

.tooltip-box { display: none; position: fixed; bottom: 82px; left: 50%; transform: translateX(-50%); width: min(92vw, 440px); background: rgba(1,10,19,0.98); border: 1px solid var(--gd); padding: 12px 14px; border-radius: 6px; z-index: 300; box-shadow: 0 10px 30px rgba(0,0,0,0.9); }
.tooltip-box.active { display: block; }
.tooltip-box b { color: var(--gd); font-family: 'Beaufort for LOL', serif; font-size: 15px; display: block; margin-bottom: 3px; }
.tooltip-box p { color: #d0c8b8; font-size: 12px; margin-bottom: 6px; }

.it .e img, .sl button img { width:100%; height:100%; object-fit:cover; display:block; border-radius:3px; }
.sl button { overflow:hidden; padding:1px; }
.buy img { width:34px; height:34px; object-fit:cover; vertical-align:middle; border:1px solid var(--gd-dark); border-radius:4px; margin-right:7px; }
.it .e { overflow:hidden; padding:1px; }

/* COMPLETE CATALOG V14 */
#cv{height:500px!important;background:#020617;border-radius:10px;box-shadow:0 25px 85px #000}
.wrap{max-width:1120px}

/* UX & ARENA V15 */
.it[data-a="sel"]{cursor:pointer;position:relative;transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease}
.it[data-a="sel"]:hover{transform:translateY(-2px);border-color:#c8aa6e;box-shadow:0 10px 28px rgba(0,0,0,.4),0 0 0 1px rgba(200,170,110,.25)}
.it[data-a="sel"]:active{transform:scale(.975)}
.it[data-a="sel"]:focus-visible{outline:2px solid #5eead4;outline-offset:2px}
.it[data-a="sel"]::after{content:'2 CLICS: EQUIPAR';position:absolute;right:7px;bottom:5px;font-size:8px;font-weight:900;letter-spacing:.07em;color:#c8aa6e;opacity:0;transition:opacity .14s}
.it[data-a="sel"]:hover::after{opacity:.9}
.game-toast{position:fixed;left:50%;top:18px;z-index:9999;transform:translate(-50%,-18px) scale(.96);padding:11px 18px;border:1px solid #c8aa6e;border-radius:8px;background:rgba(1,10,19,.96);color:#f0e6d2;font-weight:900;box-shadow:0 14px 50px #000;opacity:0;pointer-events:none;transition:.2s ease}
.game-toast.show{opacity:1;transform:translate(-50%,0) scale(1)}.game-toast.ok{border-color:#0ac8b9}.game-toast.warn{border-color:#f59e0b}

/* SIX-SLOT BUILD V16 */
.sl{grid-template-columns:repeat(6,1fr)!important}.sl button.boot-slot{border-color:#c8aa6e!important;background:linear-gradient(145deg,#2d2414,#0f1720)!important;color:#e8c86c;font-size:17px}
.build-progress{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin:7px 0 10px}.progress-slot{min-height:48px;border:1px dashed #34445a;border-radius:7px;background:#06111c;display:flex;align-items:center;gap:6px;padding:5px 7px;color:#64748b;overflow:hidden}.progress-slot span{font-size:20px;flex:0 0 auto}.progress-slot small{font-size:9px;font-weight:800;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.progress-slot.done{border-style:solid;border-color:#0ac8b9;color:#d7f8ef;background:linear-gradient(145deg,#082522,#07131d)}.progress-slot.boots{border-color:#c8aa6e;color:#e8c86c}.shop-count{text-align:right;color:#7f8c9f;font-size:10px;margin:-3px 2px 5px}.buy{position:sticky;bottom:0;z-index:8;backdrop-filter:blur(9px);background:rgba(1,10,19,.94)!important}
@media(max-width:680px){.build-progress{grid-template-columns:repeat(3,1fr)}.sl{grid-template-columns:repeat(6,34px)!important;overflow-x:auto}}

#netbar>b{display:none}@media(max-width:700px){#brandLogo{width:165px;height:52px}.version-badge{font-size:8px;padding:4px 7px}.legal-mini{font-size:4px;max-width:68px}}
.item-report{display:grid;gap:2px;padding:7px;background:#071421;border:1px solid #25344a}.item-report small{display:block;color:#94a3b8}</style>

function buildTacticalW(n, a, t) {
    if (SUMMON_CHAMPS[n]) {
        return { n: SUMMON_CHAMPS[n].n, k: 'summon', m: 0.95, cd0: 8.5, cd: 2.0, s: 0, f: 'sum' };
    }
    if (PARRY_CHAMPS[n]) {
        return { n: PARRY_CHAMPS[n], k: 'parry', m: 0.85, cd0: 9.0, cd: 2.5, s: n === 'Fiora' ? 0.9 : 0, f: 'parry' };
    }
    if (WHIRLWIND_CHAMPS.has(n)) {
        return { n: n === 'Garen' ? 'Juicio (Torbellino)' : n === 'Darius' ? 'Diezmar (Filo)' : 'Torbellino Cortante', k: 'whirlwind', m: 1.15, cd0: 6.5, cd: 1.8, s: 0, f: 'aoe' };
    }
    if (a === 'R') return { n: 'Paso Ligero / Ráfaga', k: 'volley', m: 1.05, cd0: 6.5, cd: 2.0, s: 0, f: 'dash_k' };
    if (a === 'A') return { n: 'Paso Sombrío (Emboscada)', k: 'slash', m: 1.15, cd0: 6.8, cd: 1.8, s: 0, f: 'g' };
    if (a === 'M') return { n: 'Pulso Arcano / Barrera', k: 'orb', m: 1.1, cd0: 7.0, cd: 2.2, s: 0.35, f: 'sl' };
    if (a === 'T') return { n: 'Baluarte Inquebrantable', k: 'heal', m: 0.9, cd0: 8.5, cd: 2.5, s: 0.4, f: 'sh_w' };
    if (a === 'E') return { n: 'Bendición Protectora', k: 'heal', m: 1.0, cd0: 7.5, cd: 2.0, s: 0, f: 'sh_w' };
    return { n: 'Embestida Marcial', k: 'slash', m: 1.1, cd0: 6.5, cd: 2.0, s: 0.35, f: 'g' };
}

const CH = CH_DB.map((raw, idx) => {
    const [n, e, a, t, race, weapon, feat, col, pasRaw, abRaw] = raw.split('|');
    const [pName, pType, pVal] = pasRaw.split(':');
    const baseK = abRaw.split(',').map((s, abIdx) => {
        const [nn, vfx, m, cd, st, f] = s.split(':');
        let finalVfx = vfx;
        if (abIdx === 1) {
            if (SKY_BLADE_CHAMPS.has(n)) finalVfx = 'sky_blade';
            else if (CAGE_CHAMPS.has(n)) finalVfx = 'cage_zone';
            else if (METEOR_CHAMPS.has(n)) finalVfx = 'meteor';
            else if (MEGA_PROJ_CHAMPS.has(n)) finalVfx = 'mega_proj';
            else if (WHIRLWIND_CHAMPS.has(n) && vfx === 'slash') finalVfx = 'whirlwind';
        }
        return { n: nn, k: finalVfx, m: +m, cd0: +cd, cd: +cd, s: +st, f: f || '' };
    });
    const wAb = buildTacticalW(n, a, t);
    const k = [baseK[0], wAb, baseK[1]];
    return { id: idx, n, e, a, t, race, weapon, feat, col, pas: { n: pName, t: pType, v: +pVal }, k };
});

(function auditItemPassives(){
 const used=new Set(); IT.forEach(it=>Object.keys(it.p||{}).forEach(k=>used.add(k)));

})();

                            if (S1.p.sheen_ad || S1.p.sheen_ap) m.sheen = 1;
                        }
                        lg.push([t, i, `${c.n} lanza [${cast.n}]: ${d < 0 ? '¡Esquivado!' : Math.round(d) + ' daño' + (wallSlam ? ' (¡CONTRA EL MURO!)' : '')}`, (execBonus > 1 || wallSlam) ? 'crit' : (d < 0 ? 'e' : 'p')]);
                    }
                }
                if (imRanged) performTacticalMove(0.68);
            }
            else if (m.at <= 0 && dist <= rng + 0.28) {
                let effAs = S1.as;
                if (o.s.p.slow_as) effAs *= (1 - o.s.p.slow_as / 100);
                if (m.slw > 0) effAs *= 0.82;
                m.at = 1 / Math.max(0.25, effAs);
                m.aaCount++;
                m.passiveStacks++;if(['energy','fury','rage','ferocity'].includes(c.fullKit.resource.type))m.resource=Math.min(m.resourceMax,m.resource+(c.fullKit.resource.type==='energy'?20:10));

                if (S1.p.navori) {
                    m.ab.forEach(a => a.cd = Math.max(0, a.cd * 0.85));
                }

                let isCrit = Math.random() * 100 < S1.crit;
                if (S1.p.sundered && m.sunderCD <= 0) {
                    isCrit = true;
                    m.sunderCD = 6;
                    healUnit(i, 110 + (S1.hp - m.hp) * 0.08);
                }

                const critMult = isCrit ? (1.75 + (S1.p.crit_amp || S1.p.cd_inc || 0) / 100) : 1.0;
                const gMult = (S1.p.guinsoo || 1.0) * (c.kit?.onhit || 1.0);

                let rawPhys = S1.ad * critMult;
                if(c.n==='Lee Sin' && m.stacks>0) rawPhys*=1.08;
                if(c.n==='Jhin' && m.aaCount%4===0){rawPhys*=1.35;isCrit=true;}
                if(c.n==='Yone') rawPhys*=1.06;
                if(c.n==='Sett' && m.aaCount%2===0) rawPhys*=1.18;
                if (S1.p.botrk) rawPhys += (o.hp * (S1.p.botrk / 100)) * gMult;
                if (S1.p.titanic) rawPhys += (S1.hp * (S1.p.titanic / 100)) * gMult;
                let usedSheen = false;
                if (m.sheen && S1.p.sheen_ad) { rawPhys += S1.bad * S1.p.sheen_ad; usedSheen = true; m.aiState = '🔱 ¡GOLPE BRILLO!'; }

                if (S1.p.heartsteel && m.hsCD <= 0) {
                    m.hsCD = 6.5;
                    const hsBonus = 90 + S1.hp * 0.05;
                    rawPhys += hsBonus;
                    S1.hp += 60; m.hp += 60;
                    usedSheen = true;
                    m.aiState = '❤️‍🔥 ¡ACERO CORAZÓN!';
                    lg.push([t, i, `❤️‍🔥 ¡Acero de Corazón de ${c.n} resuena (+60 Vida Máx)!`, 'crit']);
                }

                let d = deal(i, rawPhys, 'p', isCrit, true);

                if (d > 0) {
                    let rawMag = ((S1.p.onhit_flat || 0) + S1.ap * (S1.p.onhit_ap || 0)) * gMult;
                    if(S1.p.energized && m.aaCount%4===0)rawMag+=itemSource(i,'Energizado',()=>S1.p.energized);
                    if(S1.p.muramana)rawMag+=itemSource(i,'Muramana',()=>S1.mana*S1.p.muramana/100);
                    if (m.sheen && S1.p.sheen_ap) { rawMag += S1.bad * 0.75 + S1.ap * S1.p.sheen_ap; usedSheen = true; m.aiState = '🔮 ¡LICHE PROC!'; }
                    if (rawMag > 0) d += Math.max(0, deal(i, rawMag, 'm', false, true));

                    if (m.aaCount % 3 === 0 && (S1.p.kraken || c.pas.t === 'tr')) {
                        const trueDmg = (S1.p.kraken || 0) + (c.pas.t === 'tr' ? o.s.hp * (c.pas.v / 200) : 0);
                        d += Math.max(0, deal(i, trueDmg, 't', false, true));
                        usedSheen = true;
                    }

                    if (m.aaCount % 4 === 0 && (c.n === 'Braum' || c.n === 'Nautilus' || c.n === 'Kennen')) {
                        applyStun(i, 1 - i, 1.0, 'ice', 'Golpes Conmocionantes');
                    }

                    if (c.pas.t === 'vn') o.psn = 3.0;
                    if (S1.p.slow_hit || c.n === 'Ashe') o.slw = 2.2;

                    if (o.s.p.thorn) {
                        const thDmg = ((o.s.p.thorn || 20) + o.s.ar * 0.25) * 100 / (100 + S1.mr);
                        m.hp -= thDmg; o.dmg += thDmg;
                    }
                }
                m.sheen = 0;
                EV.push([t, i, (isCrit || usedSheen) ? 'c' : 'a', d, c.weapon]);
                if (isCrit && d > 0) lg.push([t, i, `💥 ¡${c.n} conecta un CRÍTICO de ${Math.round(d)}!`, 'crit']);
                if (imRanged) performTacticalMove(0.62);
            }
            else {
                performTacticalMove(1.0);
            }

            for (const u of [0, 1]) {
                if (P[u].hp <= 0 && !P[u].usedGA && P[u].s.p.ga) {
                    P[u].usedGA = true;
                    P[u].hp = P[u].s.hp * 0.50;
                    P[u].zhonya = 1.2;
                    P[u].aiState = '👼 ¡RENACIENDO!';
                    EV.push([t, u, 'ga', P[u].hp, 'heal', '👼 ¡ÁNGEL GUARDIÁN!']);
                    lg.push([t, u, `👼 ¡${P[u].c.n} renace con el 50% de vida gracias a Ángel de la Guarda!`, 'heal']);
                }
            }
        }

        F.push([
            t, P[0].hp, P[1].hp, P[0].x, P[1].x,
            P[0].stun, P[1].stun, P[0].psn, P[1].psn,
            P[0].burn, P[1].burn, P[0].slw, P[1].slw,
            P[0].sh, P[1].sh, P[0].y, P[1].y,
            P[0].zhonya, P[1].zhonya, P[0].z, P[1].z, P[0].spellShield, P[1].spellShield,
            P[0].ab[0].cd, P[0].ab[2].cd, P[1].ab[0].cd, P[1].ab[2].cd,
            P[0].maxStun || 1, P[1].maxStun || 1,
            P[0].aiState, P[1].aiState,
            P[0].ab[1].cd, P[1].ab[1].cd,
            fruits[0].active ? 1 : 0, fruits[1].active ? 1 : 0,
            P[0].inBrush + P[1].inBrush * 2 + (P[0].parry > 0 ? 4 : 0) + (P[1].parry > 0 ? 8 : 0),
            fireRadius,
            summons.map(sm => ({ owner: sm.owner, name: sm.name, col: sm.col, r: sm.r, x: sm.x, y: sm.y })),
            realmFx.active > 0 ? realmFx.owner : -1
        ]);
    }

    const w = P[0].hp > P[1].hp ? 0 : 1;
    return { F, lg, w, t, P, EV, itemReport:P.map(x=>x.itemMetrics), itemAudit:ITEM_AUDIT };
}

function drawChampionOriginal(ctx, c, facing, time, isMoving, atkProg, isZhonya, isStunned, castProg) {
    ctx.save();
    ctx.scale(facing, 1);

    const v = CHAMP_VIS[c.n] || {};
    const prop = v.prop || '';
    const helm = v.helm || '';
    const hs = v.hs || 'short';
    const bodyType = v.body || '';
    const col = isZhonya ? '#fbbf24' : (c.col || '#38bdf8');
    const col2 = isZhonya ? '#92400e' : (v.col2 || '#0b1324');
    const dark = isZhonya ? '#78350f' : '#09101d';
    const metal = isZhonya ? '#fde047' : '#cbd5e1';
    const gold = isZhonya ? '#fef08a' : '#c8aa6e';
    const hairCol = isZhonya ? '#fde047' : (v.hair || col);
    const skin = isZhonya ? '#fcd34d' : (v.skin || (c.race === 'yordle' ? '#e09f5a' : c.race === 'beast' ? '#64748b' : c.feat === 'void' ? '#c4b5fd' : '#f3d8c2'));

    if (c.race === 'yordle' && !bodyType && prop !== 'skaarl_mount') {
        ctx.scale(0.82, 0.82); ctx.translate(0, 8);
    } else if (c.race === 'titan' || bodyType === 'willump_yeti' || bodyType === 'tristy_mech' || bodyType === 'chogath_terror' || bodyType === 'malphite_rock') {
        ctx.scale(1.15, 1.15); ctx.translate(0, -5);
    }

    const walk = (isMoving && !isStunned) ? Math.sin(time * 16) * 9.5 : 0;
    const breath = isStunned ? Math.sin(time * 24) * 1.5 : Math.sin(time * 4.2) * 2.0;
    const isFloating = c.race === 'ascended' || c.race === 'serpent' || bodyType === 'yuumi_cat' || bodyType === 'velkoz_eye' || bodyType === 'anivia_bird' || bodyType === 'aurelion_dragon' || prop === 'hover_stage';
    const floatY = isFloating ? Math.sin(time * 3.5) * 6 - 7 : -Math.abs(walk) * 0.25;
    const lean = isStunned ? -0.16 : (atkProg > 0 ? Math.sin(atkProg * Math.PI) * 0.15 : (isMoving ? 0.08 : 0));
    const swing = atkProg > 0 ? Math.sin(atkProg * Math.PI) : 0;

    ctx.translate(0, floatY + breath);
    ctx.rotate(lean);

    // 0. Aura radial de lanzamiento o Ascensión
    if (castProg > 0 || c.race === 'ascended' || c.feat === 'void') {
        const auraR = 34 + (castProg > 0 ? castProg * 16 : Math.sin(time * 5) * 4);
        const aGrad = ctx.createRadialGradient(0, -18, 4, 0, -18, auraR);
        aGrad.addColorStop(0, col + (castProg > 0 ? '88' : '44'));
        aGrad.addColorStop(1, 'transparent');
        ctx.fillStyle = aGrad;
        ctx.beginPath(); ctx.arc(0, -18, auraR, 0, Math.PI * 2); ctx.fill();
    }

    // ============================================================================
    // A. MODELOS ANATÓMICOS ESPECIALES (Criaturas, Dragones, Aves, Bestias, Mechas)
    // ============================================================================
    if (bodyType === 'anivia_bird') {
        // Anivia: Criofénix de hielo real con alas desplegadas, cola y pico
        const flap = Math.sin(time * 8) * 14;
        ctx.fillStyle = '#38bdf8'; ctx.strokeStyle = '#e0f2fe'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-4, -18); ctx.quadraticCurveTo(-48, -56 + flap, -42, -8); ctx.quadraticCurveTo(-20, -4, -4, -12);
        ctx.moveTo(4, -18); ctx.quadraticCurveTo(38, -52 - flap * 0.7, 34, -8); ctx.quadraticCurveTo(18, -4, 4, -12);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#0284c7';
        ctx.beginPath(); ctx.moveTo(-8, -6); ctx.lineTo(-34, 18); ctx.lineTo(-18, 22); ctx.lineTo(0, 2); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#bae6fd';
        ctx.beginPath(); ctx.ellipse(0, -16, 14, 10, -0.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.arc(11, -26, 8, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#e0f2fe';
        ctx.beginPath(); ctx.moveTo(7, -32); ctx.lineTo(-4, -44); ctx.lineTo(13, -33); ctx.fill();
        ctx.fillStyle = '#facc15';
        ctx.beginPath(); ctx.moveTo(18, -28); ctx.lineTo(28, -25); ctx.lineTo(18, -22); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#ffffff'; ctx.fillRect(12, -28, 3, 2.5);
        ctx.restore(); return;
    }

    if (bodyType === 'aurelion_dragon') {

        ctx.beginPath(); ctx.moveTo(6, -24);
        ctx.bezierCurveTo(-28, -14, 18 + Math.sin(time * 5) * 10, 12, -28, 24);
        ctx.stroke();
        ctx.strokeStyle = '#60a5fa'; ctx.lineWidth = 5; ctx.stroke();
        ctx.fillStyle = '#1e3a8a'; ctx.strokeStyle = gold; ctx.lineWidth = 1.8;
        ctx.beginPath(); ctx.ellipse(10, -34, 13, 8, 0.1, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#fef08a';
        ctx.beginPath(); ctx.moveTo(4, -40); ctx.lineTo(-14, -56); ctx.lineTo(10, -41); ctx.fill();
        ctx.fillStyle = '#38bdf8'; ctx.fillRect(12, -36, 4, 3);
        const sCols = ['#fde047', '#f97316', '#38bdf8'];
        for (let o = 0; o < 3; o++) {
            const oa = time * 4.2 + o * (Math.PI * 2 / 3);
            const ox = Math.cos(oa) * 32, oy = -14 + Math.sin(oa) * 12;
            ctx.fillStyle = sCols[o]; ctx.shadowColor = sCols[o]; ctx.shadowBlur = 10;
            ctx.beginPath(); ctx.arc(ox, oy, 5.5, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
        }
        ctx.restore(); return;
    }

    if (bodyType === 'naafiri_hound') {
        // Naafiri: Sabueso Darkin cuadrúpedo con cuchillas dorsales + compañero de manada
        ctx.fillStyle = '#7f1d1d';
        ctx.beginPath(); ctx.ellipse(-24, 14, 10, 5, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ef4444'; ctx.fillRect(-18, 11, 3, 2);
        [-16, -6, 6, 14].forEach((lx, idx) => {
            const lSw = (idx % 2 === 0 ? 1 : -1) * walk;
            ctx.strokeStyle = '#7f1d1d'; ctx.lineWidth = 5;
            ctx.beginPath(); ctx.moveTo(lx, 4); ctx.lineTo(lx + lSw, 26); ctx.stroke();
        });
        ctx.fillStyle = '#dc2626'; ctx.strokeStyle = '#450a0a'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(0, 0, 22, 10, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#cbd5e1';
        for (let k = -2; k <= 1; k++) {
            ctx.beginPath(); ctx.moveTo(k * 7, -8); ctx.lineTo(k * 7 - 5, -24); ctx.lineTo(k * 7 + 4, -8); ctx.fill();
        }
        ctx.fillStyle = '#b91c1c';
        ctx.beginPath(); ctx.moveTo(14, -6); ctx.lineTo(32, -8); ctx.lineTo(26, 2); ctx.lineTo(14, 4); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#fde047'; ctx.fillRect(21, -6, 4, 2.5);

    }

    if (bodyType === 'smolder_dragon') {

        ctx.beginPath(); ctx.moveTo(-6, -14); ctx.quadraticCurveTo(-30, -38 + flap, -26, -4); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.strokeStyle = '#ea580c'; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.moveTo(-8, 6); ctx.quadraticCurveTo(-26, 14, -22, 2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-5, 8); ctx.lineTo(-6 - walk * 0.6, 24); ctx.moveTo(6, 8); ctx.lineTo(6 + walk * 0.6, 24); ctx.stroke();
        ctx.fillStyle = '#fb923c';
        ctx.beginPath(); ctx.ellipse(0, 0, 14, 12, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(8, -16, 12, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fde047';
        ctx.beginPath(); ctx.moveTo(2, -25); ctx.lineTo(-4, -36); ctx.lineTo(7, -26); ctx.fill();
        ctx.fillStyle = '#1e293b'; ctx.beginPath(); ctx.arc(12, -17, 4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(13, -18, 1.5, 0, Math.PI * 2); ctx.fill();
        if (swing > 0.1) {
            ctx.fillStyle = '#f97316'; ctx.shadowColor = '#fde047'; ctx.shadowBlur = 12;
            ctx.beginPath(); ctx.arc(26 + swing * 12, -14, 7 + swing * 4, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
        }

    }

    if (bodyType === 'rammus_shell') {

            ctx.closePath(); ctx.fill(); ctx.stroke();
        }
        ctx.restore();
        if (!isMoving) {
            ctx.fillStyle = '#15803d'; ctx.beginPath(); ctx.arc(14, -4, 9, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#ef4444'; ctx.fillRect(16, -7, 4, 3);
            ctx.fillStyle = '#15803d'; ctx.fillRect(-10, 14, 7, 10); ctx.fillRect(6, 14, 7, 10);

    if (bodyType === 'tahm_catfish') {

        ctx.beginPath(); ctx.ellipse(0, -6, 22, 24, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

        ctx.fillStyle = '#fde047'; ctx.beginPath(); ctx.arc(8, -27, 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#1c1917'; ctx.fillRect(-5, -36, 12, 3); ctx.fillRect(-3, -46, 8, 10);
        if (swing > 0.15) {

    if (bodyType === 'zac_slime') {

        ctx.fillStyle = '#fde047'; ctx.fillRect(3, -43, 3.5, 3.5); ctx.fillRect(8, -43, 3.5, 3.5);

    if (bodyType === 'malphite_rock') {

        ctx.fillStyle = '#38bdf8'; ctx.shadowColor = '#38bdf8'; ctx.shadowBlur = 8;
        ctx.beginPath(); ctx.arc(3, -34, 3, 0, Math.PI * 2); ctx.arc(9, -34, 3, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
        ctx.fillStyle = '#78350f'; ctx.fillRect(-11, 6, 8, 20); ctx.fillRect(3, 6, 8, 20);
        ctx.fillStyle = '#facc15'; ctx.strokeStyle = '#78350f';
        ctx.beginPath(); ctx.roundRect(14 + swing * 28, -24, 22, 20, 5); ctx.fill(); ctx.stroke();
        ctx.restore(); return;

    if (bodyType === 'willump_yeti') {
        // Nunu y Willump: Yeti blanco de 4 brazos con Nunu montado en sus hombros
        ctx.fillStyle = '#f8fafc'; ctx.strokeStyle = '#bae6fd'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(0, -12, 22, 20, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.arc(8, -26, 12, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath(); ctx.moveTo(2, -35); ctx.lineTo(-6, -46); ctx.lineTo(8, -36); ctx.fill();
        ctx.fillStyle = '#0f172a'; ctx.fillRect(11, -28, 3.5, 3);
        ctx.strokeStyle = '#f8fafc'; ctx.lineWidth = 8;
        ctx.beginPath(); ctx.moveTo(10, -16); ctx.lineTo(24 + swing * 14, -8); ctx.moveTo(8, -4); ctx.lineTo(22 + swing * 10, 4); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-9, 6); ctx.lineTo(-10 - walk, 26); ctx.moveTo(9, 6); ctx.lineTo(10 + walk, 26); ctx.stroke();
        // Nunu encima con gorro rojo
        ctx.fillStyle = '#dc2626'; ctx.beginPath(); ctx.arc(-4, -44, 8, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#f3d8c2'; ctx.beginPath(); ctx.arc(-2, -42, 5.5, 0, Math.PI * 2); ctx.fill();
        ctx.restore(); return;
    }

function startMatch(mode, diff) {

function nextRound() {

        else if (G.pick0 !== ch) { G.pick1 = ch; }
        render();
    }
    else if (a.a === 'confirmDraft') {
        const opp = G.pick1 || rnd(CH.filter(c => c !== G.pick0));
        G.ch = [G.pick0, opp];
        nextRound();
    }
    else if(a.a==='f'){lastShopClick={name:'',time:0};G.f=a.k;render();}

        const now=performance.now(),same=lastShopClick.name===a.name&&now-lastShopClick.time<520;

        if(same){lastShopClick={name:'',time:0};buySelected(true)}
        else{lastShopClick={name:a.name,time:now};updateShopSelectionUI()}

    else if (a.a === 'info') {
        e.stopPropagation();
        tt.innerHTML = `<b>${a.n}</b><p>${a.d}</p><div style="color:var(--hx);font-size:11px;font-weight:700;">${a.s}</div>`;

        G.paused = !G.paused;
        b.classList.toggle('on', G.paused);
        b.textContent = G.paused ? '▶ REANUDAR' : '⏸ PAUSA';

    else if (a.a === 'spd') {
        G.spd = +a.s;
        document.querySelectorAll('[data-a="spd"]').forEach(el => el.classList.toggle('on', +el.dataset.s === G.spd));

        if (RAF) cancelAnimationFrame(RAF);
        G.sc[G.R.w]++;
        G.scr='res';
        recordCurrentResult();
        render();
    }
    else if (a.a === 'next') {
        if (G.mode === 'draft') { G.scr = 'draft'; render(); }
        else nextRound();
    }
});

async function submitAuth(e){e.preventDefault();const mode=e.target.dataset.mode,u=q('#au').value.trim(),p=q('#ap').value,m=q('#am');try{if(!/^[A-Za-z0-9_]{3,20}$/.test(u))throw Error('Usuario no válido');if(mode==='signup'&&p!==q('#ar').value)throw Error('Las contraseñas no coinciden');m.textContent='Conectando...';const path=mode==='signup'?'/auth/v1/signup':'/auth/v1/token?grant_type=password';const body=mode==='signup'?{email:emailOf(u),password:p,data:{username:u}}:{email:emailOf(u),password:p};const d=await sb(path,{method:'POST',body:JSON.stringify(body)});NET.session=d;NET.user={id:d.user.id,username:d.user.user_metadata?.username||u};localStorage.setItem('ba_session',JSON.stringify(d));localStorage.setItem('ba_user',JSON.stringify(NET.user));q('#auth').hidden=true;account();showPage('profile')}catch(x){m.textContent=x.message;m.className='notice error'}}
const DDRAGON='https://ddragon.leagueoflegends.com/cdn/16.20.1';
const CHAMPION_SLUG={"Yunara":"Yunara","Zaahen":"Zaahen","Locke":"Locke","Wukong":"MonkeyKing","Cho'Gath":"Chogath","Kha'Zix":"Khazix","Vel'Koz":"Velkoz","Kai'Sa":"Kaisa","Rek'Sai":"RekSai","LeBlanc":"Leblanc","Nunu y Willump":"Nunu","Bel'Veth":"Belveth","K'Sante":"KSante","Renata Glasc":"Renata","Dr. Mundo":"DrMundo","Jarvan IV":"JarvanIV","Lee Sin":"LeeSin","Master Yi":"MasterYi","Miss Fortune":"MissFortune","Tahm Kench":"TahmKench","Twisted Fate":"TwistedFate","Xin Zhao":"XinZhao","Aurelion Sol":"AurelionSol"};
const champSlug=n=>CHAMPION_SLUG[n]||n.replace(/[^A-Za-z0-9]/g,'');
const championPortrait=n=>`${DDRAGON}/img/champion/${champSlug(n)}.png`;
const normalizeName=n=>String(n||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
function findGameItem(name){ if(CURRENT_2620_META[name])return CURRENT_2620_META[name];const z=normalizeName(name);return IT.find(x=>normalizeName(x.n)===z||normalizeName(x.originalName)===z)||null}
function metaIcon(kind,name,avatar){
 if(kind==='champion'||kind==='user'){const ch=kind==='user'?(avatar||'Aatrox'):name;return `<span class="meta-icon"><img src="${championPortrait(ch)}" alt="${esc(ch)}" title="${esc(ch)}" onerror="this.parentElement.textContent='◆'"></span>`}
 const it=findGameItem(name);return it?.id?`<span class="meta-icon"><img src="${DDRAGON}/img/item/${it.id}.png" alt="${esc(name)}" onerror="this.parentElement.textContent='◈'"></span>`:`<span class="meta-icon">◈</span>`;
}
const META_MIN={champion:5,item:5,boots:5,user:3};
const META_SCHEMA_VERSION='1.1-global-views-v1';
function wrRow(name,matches,wins,extra={}){
 const raw=matches?wins/matches*100:0,priorGames=10,adjusted=(wins+priorGames*.5)/(matches+priorGames)*100;
 return {...extra,matches,wins,raw_win_rate:raw,adjusted_win_rate:adjusted,sample_status:matches>=(extra.kind==='user'?3:5)?'MUESTRA VÁLIDA':'MUESTRA PEQUEÑA'};
}
function validMetaRows(rows,kind){
 if(!Array.isArray(rows))return false;
 return rows.every(x=>Number.isFinite(Number(x.matches))&&Number.isFinite(Number(x.wins))&&Number(x.wins)<=Number(x.matches)&&Number(x.wins)>=0&&(kind==='champion'?x.champion:kind==='user'?x.username:x.item_name));
}
function normalizeMetaItem(name){const it=findGameItem(name);return it?.n||name;}
function completeCatalog(kind,stats){
 const byName=new Map(stats.map(x=>[normalizeName(x.item_name),x]));
 return IT.filter(x=>kind==='boots'?x.c==='B':x.c!=='B').map(it=>byName.get(normalizeName(it.n))||byName.get(normalizeName(it.originalName))||{item_name:it.n,slot:it.c==='B'?1:2,is_boots:it.c==='B',matches:0,wins:0,raw_win_rate:0,adjusted_win_rate:50,sample_status:'SIN DATOS'}).sort(metaSort);
}
function completeChampions(stats){const m=new Map(stats.map(x=>[normalizeName(x.champion),x]));return CH.map(c=>m.get(normalizeName(c.n))||{champion:c.n,matches:0,wins:0,raw_win_rate:0,adjusted_win_rate:50,sample_status:'SIN DATOS'}).sort(metaSort)}
function metaSort(a,b){return (b.matches>0)-(a.matches>0)||Number(b.adjusted_win_rate)-Number(a.adjusted_win_rate)||Number(b.matches)-Number(a.matches)||String(a.champion||a.item_name||a.username).localeCompare(String(b.champion||b.item_name||b.username),'es')}
async function rebuildMeta(kind){
 const matches=await sb('/rest/v1/matches?select=id,user_id,player_champion,enemy_champion,winner_side,is_valid&is_valid=eq.true&limit=5000');
 if(kind==='champion'){
  const g=new Map(),add=(n,w)=>{if(!n)return;const k=normalizeName(n),z=g.get(k)||{name:n,m:0,w:0};z.m++;z.w+=w?1:0;g.set(k,z)};
  matches.forEach(m=>{add(m.player_champion,m.winner_side==='player');add(m.enemy_champion,m.winner_side==='enemy')});
  return [...g.values()].map(z=>wrRow(z.name,z.m,z.w,{champion:z.name,kind})).sort(metaSort);
 }
 if(kind==='user'){
  const profiles=await sb('/rest/v1/profiles?select=id,username,avatar_champion&limit=5000'),pm=new Map(profiles.map(x=>[x.id,x])),g=new Map();
  matches.forEach(m=>{if(!m.user_id)return;const z=g.get(m.user_id)||{m:0,w:0};z.m++;z.w+=m.winner_side==='player'?1:0;g.set(m.user_id,z)});
  return [...g].filter(([id])=>pm.has(id)).map(([id,z])=>{const u=pm.get(id);return wrRow(u.username,z.m,z.w,{username:u.username,avatar_champion:u.avatar_champion||'Aatrox',kind})}).sort(metaSort);
 }
 const validIds=new Set(matches.map(x=>x.id)),winnerById=new Map(matches.map(x=>[x.id,x.winner_side]));
 const rows=await sb('/rest/v1/match_items?select=match_id,side,slot,item_name,is_boots&limit=30000'),g=new Map();
 rows.forEach(r=>{if(!validIds.has(r.match_id))return;const name=normalizeMetaItem(r.item_name),it=findGameItem(name),isBoot=it?.c==='B'||r.is_boots===true;if((kind==='boots')!==isBoot)return;const key=normalizeName(name),z=g.get(key)||{name,matches:new Set(),wins:new Set(),isBoot};z.matches.add(r.match_id);if(winnerById.get(r.match_id)===r.side)z.wins.add(r.match_id);g.set(key,z)});
 return [...g.values()].map(z=>wrRow(z.name,z.matches.size,z.wins.size,{item_name:z.name,is_boots:z.isBoot,slot:z.isBoot?1:2,kind})).sort(metaSort);
}
async function readMeta(kind){
 const view=kind==='champion'?'champion_meta':kind==='user'?'user_meta':'item_meta',cols=kind==='champion'?'champion,matches,wins,raw_win_rate,adjusted_win_rate,sample_status':kind==='user'?'username,avatar_champion,matches,wins,raw_win_rate,adjusted_win_rate,sample_status':'item_name,slot,is_boots,matches,wins,raw_win_rate,adjusted_win_rate,sample_status';
 try{const d=await sb(`/rest/v1/${view}?select=${cols}&order=adjusted_win_rate.desc&limit=1000`);if(validMetaRows(d,kind))return d;throw Error('La vista devolvió columnas o cifras inválidas');}catch(e){throw Error('Vista '+view+' no disponible o incompatible. Ejecuta supabase_meta_v1_1.sql. Detalle: '+e.message)}
}
function tierFrom(row,kind){
 const min=META_MIN[kind],m=Number(row.matches)||0,score=Number(row.adjusted_win_rate)||50;if(m<min)return'?';
 return score>=57?'S':score>=54?'A':score>=50?'B':score>=47?'C':'D';
}
async function meta(kind='champion'){
 q('#portal').innerHTML=`<section class="page"><h1>META GLOBAL</h1><div class="meta-tabs"><button data-meta="champion">CAMPEONES</button><button data-meta="item">OBJETOS</button><button data-meta="boots">BOTAS</button><button data-meta="user">USUARIOS</button></div><p class="meta-note">Winrate exacto = victorias / partidas. Datos globales validados desde vistas agregadas de Supabase. Tier ajustado con prior 50%; mínimo 5 partidas y usuarios 3.</p><div id="ml" class="notice">Cargando y validando datos...</div></section>`;
 try{
  let d=await readMeta(kind);if(kind==='champion')d=completeChampions(d);else if(kind==='item'||kind==='boots')d=completeCatalog(kind,d);else d.sort(metaSort);
  d=d.filter(x=>(Number(x.matches)||0)>=META_MIN[kind]);
  window.__META_AUDIT__={kind,rows:d.length,invalid:d.filter(x=>Number(x.wins)>Number(x.matches)||!Number.isFinite(Number(x.adjusted_win_rate))),schema:META_SCHEMA_VERSION,generatedAt:new Date().toISOString()};
  if(window.__META_AUDIT__.invalid.length)throw Error('Filas Meta inválidas: '+JSON.stringify(window.__META_AUDIT__.invalid));
  q('#ml').className='meta-list';q('#ml').innerHTML=d.length?d.map((x,i)=>{const matches=Number(x.matches)||0,wins=Number(x.wins)||0,exactWR=matches?wins/matches*100:NaN,wrText=Number.isFinite(exactWR)?exactWR.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+'% WR':'Sin datos',t=tierFrom(x,kind),name=x.champion||x.item_name||x.username,status=matches>=META_MIN[kind]?'MUESTRA VÁLIDA':'SIN MÍNIMO';return `<div class="meta-row"><b>#${i+1}</b><span class="tier ${t==='?'?'unknown':''}">${t}</span>${metaIcon(kind,name,x.avatar_champion)}<strong>${esc(name)}</strong><span title="${wins} victorias de ${matches} partidas">${wrText}</span><small>${matches} partidas · ${wins} victorias · ${status}</small></div>`}).join(''):'Todavía no hay datos.';
 }catch(e){q('#ml').className='notice error';q('#ml').textContent='No se pudo validar el Meta: '+e.message;console.error(e)}
}

function historyItemIcon(name){const it=findGameItem(name);return it?.id?`<img src="${DDRAGON}/img/item/${it.id}.png" alt="${esc(name)}" title="${esc(name)}" onerror="this.style.display='none'">`:`<span title="${esc(name)}">◈</span>`}
async function history(){
 if(!NET.user){q('#portal').innerHTML='<section class="page"><h1>HISTORIAL</h1><p>Inicia sesión para ver tus últimas partidas.</p><button data-net="login">INICIAR SESIÓN</button></section>';return}
 q('#portal').innerHTML='<section class="page"><h1>ÚLTIMAS 20 PARTIDAS</h1><p class="meta-note">Solo se conservan partidas de los últimos 20 días.</p><div id="historyList" class="notice">Cargando historial...</div></section>';
 try{
  const ms=await sb('/rest/v1/matches?select=id,created_at,player_champion,enemy_champion,winner_side,duration_seconds,player_damage,player_physical_damage,player_magic_damage,player_healing,player_mitigation,performance_grade,performance_score&user_id=eq.'+NET.user.id+'&is_valid=eq.true&order=created_at.desc&limit=20');
  if(!ms.length){q('#historyList').textContent='Todavía no hay partidas guardadas.';return}
  const ids=ms.map(x=>x.id).join(','),items=await sb('/rest/v1/match_items?select=match_id,side,slot,item_name&side=eq.player&match_id=in.('+ids+')&order=slot.asc');
  const byMatch=new Map();items.forEach(i=>{const a=byMatch.get(i.match_id)||[];a.push(i);byMatch.set(i.match_id,a)});
  q('#historyList').className='history-list';q('#historyList').innerHTML=ms.map(m=>{const win=m.winner_side==='player',date=new Date(m.created_at),build=byMatch.get(m.id)||[],grade=m.performance_grade||'—';return `<article class="history-match ${win?'win':'loss'}"><img class="history-champ" src="${championPortrait(m.player_champion)}" alt="${esc(m.player_champion)}"><div><b>${esc(m.player_champion)} vs ${esc(m.enemy_champion)}</b><div class="history-result ${win?'win':'loss'}">${win?'VICTORIA':'DERROTA'} · Nota ${esc(grade)}</div><small>${Number(m.duration_seconds||0).toFixed(1)}s · ${Math.round(m.player_damage||0)} daño</small></div><div><div class="history-build">${build.sort((a,b)=>a.slot-b.slot).map(i=>historyItemIcon(i.item_name)).join('')}</div><small>🗡️ AD ${Math.round(m.player_physical_damage||0)} · 🔮 AP ${Math.round(m.player_magic_damage||0)} · 💚 ${Math.round(m.player_healing||0)} · 🛡️ ${Math.round(m.player_mitigation||0)}</small></div><time datetime="${m.created_at}">${date.toLocaleString('es-ES',{dateStyle:'short',timeStyle:'short'})}</time></article>`}).join('');
 }catch(e){q('#historyList').className='notice error';q('#historyList').textContent='No se pudo cargar el historial: '+e.message}
}
async function profile(){if(!NET.user){q('#portal').innerHTML='<section class="page"><h1>PERFIL</h1><p>Inicia sesión para guardar tus partidas.</p><button data-net="signup">CREAR CUENTA</button></section>';return}q('#portal').innerHTML='<section class="page"><h1>'+esc(NET.user.username)+'</h1><div id="ps" class="notice">Cargando estadísticas...</div></section>';try{const [prof]=await sb('/rest/v1/profiles?select=username,avatar_champion&id=eq.'+NET.user.id);const d=await sb('/rest/v1/matches?select=winner_side,player_champion,enemy_champion,created_at&user_id=eq.'+NET.user.id+'&order=created_at.desc&limit=100');const w=d.filter(x=>x.winner_side==='player').length,current=prof?.avatar_champion||'Aatrox';NET.user.avatar_champion=current;q('#ps').className='';q('#ps').innerHTML=`<div class="profile-avatar"><img src="${championPortrait(current)}"><div><b>Icono de usuario: ${esc(current)}</b><p>Este retrato aparecerá en la tier list de usuarios.</p><select id="avatarSelect">${CH.map(c=>`<option ${c.n===current?'selected':''}>${esc(c.n)}</option>`).join('')}</select><button data-save-avatar="1">GUARDAR ICONO</button></div></div><div class="stats"><article><b>${d.length}</b>Partidas</article><article><b>${w}</b>Victorias</article><article><b>${d.length?(w/d.length*100).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2}):'0,00'}%</b>Win rate</article></div>`}catch(e){q('#ps').textContent=e.message}}
function showPage(p){const app=q('#app'),portal=q('#portal');if(p==='game'){portal.innerHTML='';portal.hidden=true;app.hidden=false}else{app.hidden=true;portal.hidden=false;p==='meta'?meta():p==='history'?history():profile()}}
async function saveOnlineMatch(payload,items){if(!NET.user)return;const rows=await sb('/rest/v1/matches?select=id',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({...payload,user_id:NET.user.id})});await sb('/rest/v1/match_items',{method:'POST',body:JSON.stringify(items.map(x=>({...x,match_id:rows[0].id})))})}
let lastSavedResult=null;
async function recordCurrentResult(){
 if(!NET.user||!G?.R||!G?.ch||!G?.it)return;
 const fingerprint=[G.ch[0].n,G.ch[1].n,G.R.t,G.R.w,G.sc.join('-')].join('|');if(lastSavedResult===fingerprint)return;lastSavedResult=fingerprint;
 const clientId=crypto.randomUUID?crypto.randomUUID():('00000000-0000-4000-8000-'+String(Date.now()).padStart(12,'0').slice(-12));
 const p0=G.R.P?.[0]||{},p1=G.R.P?.[1]||{};
 const grade=performanceGrade(G.R);
 const payload={game_version:'1.1-ranked-26.20',simulation_version:'strict-builds-meta-v2',mode:G.mode||'aram',difficulty:Number(G.diff||1),duration_seconds:Math.max(1,Number(G.R.t||1)),player_champion:G.ch[0].n,enemy_champion:G.ch[1].n,winner_side:G.R.w===0?'player':'enemy',player_damage:Math.round(p0.dmg||0),enemy_damage:Math.round(p1.dmg||0),player_physical_damage:Math.round(p0.physicalDamage||0),player_magic_damage:Math.round(p0.magicDamage||0),enemy_physical_damage:Math.round(p1.physicalDamage||0),enemy_magic_damage:Math.round(p1.magicDamage||0),performance_grade:grade.grade,performance_score:grade.score,player_healing:Math.round(p0.heal||0),enemy_healing:Math.round(p1.heal||0),player_mitigation:Math.round(p0.mit||0),enemy_mitigation:Math.round(p1.mit||0),event_count:G.R.EV?.length||0,client_match_id:clientId,is_valid:true};
 const items=[...(G.it[0]||[]).map((it,i)=>({side:'player',slot:i+1,item_name:canonicalItemName(it.originalName||it.n),is_boots:it.c==='B'})),...(G.it[1]||[]).map((it,i)=>({side:'enemy',slot:i+1,item_name:canonicalItemName(it.originalName||it.n),is_boots:it.c==='B'}))];
 try{await saveOnlineMatch(payload,items);showToast?.('Partida sincronizada con el meta','ok')}catch(e){console.error('No se pudo sincronizar',e);}
}

document.addEventListener('click',e=>{ensureAudio();if(e.target.dataset.saveAvatar)saveAvatar(q('#avatarSelect').value);const p=e.target.dataset.page,n=e.target.dataset.net,m=e.target.dataset.meta;if(p)showPage(p);if(m)meta(m);if(n==='login')auth('signin');if(n==='signup')auth('signup');if(n==='close')q('#auth').hidden=true;if(n==='out'){NET={session:null,user:null};localStorage.removeItem('ba_session');localStorage.removeItem('ba_user');account();showPage('game')}});document.addEventListener('submit',e=>{if(e.target.id==='authForm')submitAuth(e)});account();showPage('game');
</script></body>
